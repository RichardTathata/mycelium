[package]
name = "mycelium-effects"
version = "2.19.0"
edition = "2024"
rust-version = "1.88"
authors = ["Dr. Richard Nicholson <tathatasystems@proton.me>"]
description = "The effects companion for Mycelium (v3 contracts axis, item 1 PR 5): a transactional reference destination whose dedup row and business change commit together, yielding the destination-commit receipt — the one rung the substrate never provides on its own. Built entirely on Mycelium's public API."
license = "AGPL-3.0-only"
repository = "https://github.com/RichardTathata/mycelium"
keywords = ["exactly-once", "idempotency", "receipts", "multi-agent", "distributed-systems"]
categories = ["database", "asynchronous"]

[features]
default = []
# The tuple-space consumer with effect recovery (item 1 PR 6): a worker that commits each item's
# effect at a destination *before* acknowledging it, so a worker that dies between the two is
# re-delivered and the second apply is `Replayed`. Optional so the crate's core — the destination
# and the receipt — couples to neither companion.
tuple-space = ["dep:mycelium-tuple-space", "dep:bytes"]
# The gateway-side constructor (`Composition::from_envelope`, composed-effect.md §9): builds a
# composition from the `ActionEnvelope` the gateway assembled and the mandate the caller presented.
# Needs the gateway's attesting build, so it pulls those features of the substrate in; optional so
# a destination that assembles its own composition never does.
envelope = ["mycelium/gateway", "mycelium/tls", "dep:serde_json"]

[dependencies]
# Companion-crate contract: only Mycelium's PUBLIC API is used — no internal
# access. This dependency line is itself the composability proof.
mycelium = { path = "..", default-features = false }
mycelium-tuple-space = { path = "../mycelium-tuple-space", optional = true }
bytes = { version = "1", optional = true }
# `Composition::from_caller` parses the carried mandate out of the caller context's JSON.
serde_json = { version = "1", optional = true }

# The reference destination. `bundled` compiles SQLite in, so CI and every developer get the same
# engine and no system library is a hidden dependency. Quarantined to this crate: core carries no
# database, and `-p` builds of the substrate never pay for it.
rusqlite = { version = "0.32", features = ["bundled"] }
tokio    = { version = "1.35", features = ["rt", "time"] }
tracing  = "0.1"

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
# test-only: the bind-verified, process-unique port allocator for a live agent in the recovery test.
mycelium = { path = "..", default-features = false, features = ["test-util"] }
bytes = "1"
