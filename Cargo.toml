[package]
name = "mycelium"
version = "2.13.0"
edition = "2024"
rust-version = "1.88"
authors = ["Dr. Richard Nicholson <tathatasystems@proton.me>"]
description = "Broker-less gossip substrate for AI agent fleets: KV store, signal mesh, consensus, capability discovery"
license = "AGPL-3.0-only"
# Commercial embedding license available — see README §License or contact tathatasystems@proton.me
repository = "https://github.com/RichardEko/mycelium"
readme = "README.md"
keywords = ["distributed-systems", "gossip", "p2p", "protocol"]
categories = ["network-programming", "asynchronous"]

[features]
default = ["cli", "gateway", "consensus"]
cli = ["dep:tracing-subscriber"]
# Layer III epidemic consensus engine (ballots/quorum, system/group/cross_group
# propose, GroupQuorum, leased commits, commit-conflict tripwire) + the consistency
# overlay built on it (`consistent_set`/`consistent_get`/distributed lock). Default-on;
# drop it for minimal embeds that need KV + signals + capabilities but not agreement:
#   mycelium = { version = "1", default-features = false, features = ["gateway"] }
# A consensus-disabled node still *forwards* PROPOSE/VOTE/COMMIT signals (forwarding
# lives in mycelium-core, unconditional) — it just never acts on them.
consensus = []
# Embedded HTTP gateway: REST/SSE/WebSocket bridge, MCP over HTTP, bulk staging.
# Pulls in Axum and related deps. Disable for bare-metal / WASM / no-std targets:
#   mycelium = { version = "1", default-features = false }
gateway = ["dep:axum", "dep:tower-http", "dep:tokio-stream", "dep:futures-util", "dep:reqwest", "dep:hyper-util", "dep:tower-service"]
# Exposes the `fuzz_internals` module re-exporting internal decoders to the
# cargo-fuzz harness under `fuzz/`. NOT part of the stable public API — only
# enable when building fuzz targets.
fuzz-internals = []
# Enables mTLS on the gossip TCP port, keypair-backed node identity, and
# consensus payload signing. Adds tokio-rustls, rcgen, and ed25519-dalek.
tls = ["mycelium-core/tls", "dep:tokio-rustls", "dep:rustls", "dep:rcgen", "dep:rustls-pemfile", "dep:ed25519-dalek", "dep:rand_core", "dep:arc-swap", "dep:webpki", "reqwest?/rustls-tls-manual-roots"]
# Enables OTEL span export from SkillRunner (opentelemetry-otlp gRPC).
otel = ["dep:opentelemetry", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "dep:opentelemetry_sdk"]
# Exposes a Prometheus /metrics endpoint on the gateway HTTP port.
# Zero-cost when absent: all counter!/histogram!/gauge! calls compile to no-ops.
metrics = ["mycelium-core/metrics", "dep:metrics", "dep:metrics-exporter-prometheus"]
# Exposes A2A (Agent-to-Agent protocol) endpoints: GET /.well-known/agent.json
# and POST /a2a JSON-RPC. Requires the embedded gateway.
a2a = ["gateway"]
# Adds LLM-backed prompt skills: store prompt templates in the cluster KV,
# bind a node-local LLM backend, and expose as a callable capability.
# Requires the embedded gateway for the prompt HTTP endpoint.
llm = ["gateway"]
# Compliance layer (v1.x completion — see docs/plans/v1x-completion.md): RBAC /
# identity roles, gateway endpoint ACLs, tamper-evident audit trail. Implies
# `gateway` (the auth/audit HTTP surface) + `tls` (signed identity + roles) and
# pulls in `sha2` for the audit hash-chain (already in the tree via ed25519-dalek).
compliance = ["mycelium-core/compliance", "gateway", "tls", "dep:jsonwebtoken"]
# Exposes `test_util::alloc_port` (a bind-verified port allocator) for companion integration
# tests. Test-only — no runtime deps, never enable in a production build.
# Forwards core's replay seams (item 6). Off in every shipped build.
sim = ["mycelium-core/sim"]
test-util = []

# The `fuzz/` directory is its own cargo-fuzz crate; keep it out of any
# implicit-workspace traversal from this parent manifest.
[workspace]
members = ["mycelium-core", "mycelium-sim", "mycelium-tuple-space", "mycelium-blackboard", "mycelium-wiki", "mycelium-wasm-host", "mycelium-agentfacts", "mycelium-reason", "mycelium-guardrails", "mycelium-effects", "mycelium-commitment", "examples/coop", "loom-spike"]
# `fuzz/` is its own cargo-fuzz crate; the wasm guest fixture is a wasm32 cdylib
# built out-of-band (its prebuilt .wasm is committed as a test fixture).
exclude = ["fuzz", "mycelium-wasm-host/tests/fixtures/echo-component", "examples/conway-gpu"]

[dependencies]
# Layers I+II substrate (ROADMAP §v2.0 M1). This crate (the full substrate) adds
# Layers III+ on top. Feature-forwarded below so `mycelium`'s tls/metrics/compliance
# enable the matching surface in core.
mycelium-core = { path = "mycelium-core" }

# Core
tokio = { version = "1.35", features = ["full"] }
fastrand = "2"

# Data structures
papaya = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
ahash = "0.8"
bytes = { version = "1", features = ["serde"] }
toml = "0.7"

# TCP keepalive configuration (unix only)
socket2 = "0.5"

# Synchronization
parking_lot = "0.12"

# Async trait support
async-trait = "0.1"

# Error handling
thiserror = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# HTTP gateway (optional — enabled by the "gateway" feature)
axum         = { version = "0.8",  optional = true }
tower-http   = { version = "0.6",  features = ["cors"], optional = true }
tokio-stream = { version = "0.1",  features = ["sync"], optional = true }
futures-util = { version = "0.3",  optional = true }
# Native gateway-TLS serve loop (SOC 2 WS-A): both are already in the tree
# transitively via axum, so declaring them adds no new compiled crate.
hyper-util   = { version = "0.1",  features = ["server-auto", "tokio", "service"], optional = true }
tower-service = { version = "0.3", optional = true }
# JSON / HTTP utilities used beyond just the gateway
serde_json   = "1.0"
base64       = "0.22"
# HTTP client — used by MCP client bridge, bulk transport, and capability probes.
# Optional: enabled by the "gateway" feature. Bare-metal / no-std builds that
# compile without gateway do not pull in Hyper or its transitive deps.
reqwest      = { version = "0.12", features = ["json"], optional = true }

# TLS (optional — enabled by the "tls" feature)
tokio-rustls   = { version = "0.26", optional = true }
rustls         = { version = "0.23", default-features = false, features = ["ring"], optional = true }
rcgen          = { version = "0.13", optional = true }
rustls-pemfile = { version = "2",    optional = true }
# X.509 reading for the federation edge's SPKI pins (`federation::pinning`). This is the parser
# rustls already uses — it is in the tree via `rustls`, so declaring it adds no new compiled crate,
# and reading the SPKI with the same code that validates chains is the point: the alternative was a
# second, hand-rolled scan over attacker-supplied DER.
webpki         = { package = "rustls-webpki", version = "0.103", optional = true }
ed25519-dalek  = { version = "2",    features = ["rand_core", "pkcs8"], optional = true }
rand_core      = { version = "0.6",  features = ["getrandom"],         optional = true }
# Lock-free atomic swap of the live TLS identity (hot cert rotation, WS5).
arc-swap       = { version = "1",    optional = true }

# SHA-256 for the node-local journal's content hashes (`agent::journal`, ungated since item 4
# PR 3 — the rights ledger needs it in every build), the audit hash-chain and the AE argument
# digest. Unconditional: a minimal build gains one small pure-Rust crate, already in the tree for
# every `tls` build via ed25519-dalek.
sha2           = "0.10"
# OIDC JWT validation for SSO (optional — enabled by the "compliance" feature).
# Uses `ring` (already in the tree via rustls) for RS256/ES256 verification.
jsonwebtoken   = { version = "9", optional = true }

# OTEL (optional — enabled by the "otel" feature, used by skillrunner)
opentelemetry          = { version = "0.27", optional = true }
opentelemetry_sdk      = { version = "0.27", optional = true }
opentelemetry-otlp     = { version = "0.27", optional = true, features = ["grpc-tonic"] }
tracing-opentelemetry  = { version = "0.28", optional = true }

# Prometheus metrics (optional — enabled by the "metrics" feature)
metrics                     = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.16", optional = true }

[dev-dependencies]
# Enable mycelium-core's test-only helpers (N_GOSSIP_SHARDS, store_hash, …) for
# this crate's test builds. Cargo unions this with the normal dependency above, so
# `test-support` is active only for tests, never a plain `cargo build`.
mycelium-core = { path = "mycelium-core", features = ["test-support"] }
# Companion crate, consumed by examples/three_node_demo (integration
# scenario 13). Dev-dependency cycles are legal in Cargo: the companion's
# normal dependency on `mycelium` is unaffected.
mycelium-tuple-space = { path = "mycelium-tuple-space", features = ["gateway"] }
tokio        = { version = "1.35", features = ["full", "test-util"] }
criterion    = { version = "0.5", features = ["async_tokio"] }
libc         = "0.2"
# GPU deps (wgpu/pollster/bytemuck) were here only for the conway_gpu demo, which
# dragged the whole GPU toolchain into every `cargo test` / `clippy --tests` build.
# That demo now lives in its own excluded crate: examples/conway-gpu/.
async-openai = "0.28"
proptest     = "1"

[[bin]]
name = "skillrunner"
path = "src/bin/skillrunner/main.rs"

[[bench]]
name    = "throughput"
harness = false

[[bench]]
name              = "gateway_overhead"
harness           = false
required-features = ["gateway", "test-util"]


[[example]]
name              = "federated_domains"
path              = "examples/federated_domains.rs"
# The whole item-2 contract needs signature verification.
required-features = ["tls"]

[[example]]
name              = "federation_node"
path              = "examples/federation_node.rs"
# The two-mesh Docker suite's binary (item 2 PR 10b): the federation edge + client need the
# gateway, TLS and the A2A edge; the control API and admin routes use axum directly.
required-features = ["gateway", "tls", "a2a", "cli"]

[[example]]
name              = "auditor_questions"
path              = "examples/auditor_questions.rs"
# `tls` because a tamper-evident chain must be signed — an unsigned one is a contradiction in
# terms; `compliance` for the audit surface and the erasure registry.
required-features = ["tls", "compliance"]

[[example]]
name              = "identity_one_record"
path              = "examples/identity_one_record.rs"
# `tls` for the identity machinery itself; `compliance` for the signed role claim, which is the
# observable this example uses to prove a key actually reached a peer's `peer_keys` — a key that
# never arrived shows up as a missing role rather than a silent success.
required-features = ["tls", "compliance"]

[[example]]
name              = "federation_trust_is_not_transitive"
path              = "examples/federation_trust_is_not_transitive.rs"
# Signature verification across three domains.
required-features = ["tls"]

[[example]]
name              = "knowledge_layer"
path              = "examples/knowledge_layer.rs"
# `knowledge` is behind `tls` — the record types verify Ed25519 signatures.
required-features = ["tls"]

[[example]]
name              = "ops_console"
path              = "examples/ops_console/main.rs"
required-features = ["gateway"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
incremental = false

[lints.clippy]
# Pre-existing pattern in test code — not worth refactoring 61 test initialisers
field_reassign_with_default = "allow"
