[package]
name         = "mycelium-gateway-free-tests"
version      = "0.0.0"
edition      = "2024"
publish      = false
description  = "Tests that run against `mycelium` built without the `gateway` feature."

# Why a crate of its own (realignment repairs R8): `mycelium`'s own dev-dependencies enable
# `gateway` (`mycelium-tuple-space` with its `gateway` feature depends on `mycelium/gateway`), and
# Cargo unifies features across a test build, so `cargo test -p mycelium --no-default-features` is a
# gateway build. Run this crate on its own — `cargo test -p mycelium-gateway-free-tests` — and
# `mycelium` is compiled with no default features at all. Built in one invocation with a crate that
# enables `gateway`, the features unify again; the first test says so rather than passing.

[dev-dependencies]
mycelium = { path = "..", default-features = false }
tokio    = { version = "1.35", features = ["full"] }

[lints.clippy]
# The workspace's own pattern for building a `GossipConfig` (the root crate allows it too): start from
# `Default` and assign the fields a test needs.
field_reassign_with_default = "allow"
