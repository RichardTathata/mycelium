# The worker: needs an optimizer nobody deploys (a depot will install one), drains the
# `optimize` lane and completes into `done`.
principal = "worker"

[[requirement]]
ns   = "route"
name = "optimize"

[[requirement]]
ns   = "depot"
name = "intake"
  [requirement.attrs]
  capacity = { gte = 50 }
  [requirement.ranking]
  attribute = "capacity"
  order     = "descending"

[[lane]]
name = "optimize"
role = "consumes"

[[lane]]
name = "done"
role = "produces"

# No authority vocabulary here: what admits the worker's calls is declared by the depots that receive them. A
# `[[mandate]]` held by `worker` would name the unit, and a provider verifies a member's mandate as its node's.
