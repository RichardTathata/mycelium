# The worker: needs an optimizer nobody deploys (a depot will install one), drains the
# `optimize` lane and completes into `done`.
principal = "worker"

[[requirement]]
ns   = "route"
name = "optimize"

[[requirement]]
ns   = "depot"
name = "intake"
  [requirement.attrs]
  capacity = { gte = 50 }
  [requirement.ranking]
  attribute = "capacity"
  order     = "descending"

[[lane]]
name = "optimize"
role = "consumes"

[[lane]]
name = "done"
role = "produces"

# The authority vocabulary this unit expects: what it may call, as a grant enumerates it
# (`{operation}:{resource}` — the gateway's own form), and the rule that admits it.
[[mandate]]
holder     = "worker"
scope      = "routing"
operations = ["skill.invoke:skill:route/optimize", "skill.invoke:skill:depot/intake"]
