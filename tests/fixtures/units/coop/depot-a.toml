# A depot: offers intake, and hosts what the fleet needs installed (a provisioner runs here).
principal = "depot-a"

[[capability]]
ns       = "depot"
name     = "intake"
ttl_secs = 30
  [capability.attrs]
  region   = "north"
  capacity = 120

[hosts]
kinds                = ["wasm-component", "blob"]
install_budget_bytes = 8589934592
headroom             = 0.8
trusted_publishers   = ["ed25519:coop-ci"]
placement_root       = "/var/lib/mycelium/artifacts"

# Keep at least one optimizer alive fleet-wide, at most two — independent of demand.
[[presence]]
ns            = "route"
name          = "optimize"
min_providers = 1
max_providers = 2
