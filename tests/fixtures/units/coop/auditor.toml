# The auditor: reads completed work off the `done` lane and asks the evidence questions.
principal = "auditor"

[[lane]]
name = "done"
role = "consumes"

[[rule]]
actor            = "worker"
operation        = "skill.invoke"
resource         = "skill:route/optimize"
requires_mandate = "routing"

[[rule]]
actor            = "worker"
operation        = "skill.invoke"
resource         = "skill:depot/intake"
requires_mandate = "routing"
