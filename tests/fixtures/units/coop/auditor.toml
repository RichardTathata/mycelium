# The auditor: reads completed work off the `done` lane and asks the evidence questions.
principal = "auditor"

[[lane]]
name = "done"
role = "consumes"

# The worker's call of a depot's intake, a deployed capability, under its `routing` mandate. The optimizer is a
# hosted component: its rule is in the depots that host it (`depot-a.toml`, `depot-b.toml`), as `cap.invoke`.
[[rule]]
actor            = "worker"
operation        = "skill.invoke"
resource         = "skill:depot/intake"
requires_mandate = "routing"
