# Nightly scale suites — the 100-node coverage hosted CI structurally can't run.
#
# The hosted `Cluster suites (Docker)` workflow gates the small (3–4 node) correctness suites; it
# deliberately stops there because a 2-core GitHub-hosted runner hits the single-host Docker-bridge
# iptables ceiling above ~50 nodes (docs/wiki/dev/testing/scale-tests.md). The real 100-node runs
# need a bigger box — so they run here, on a **self-hosted** runner, nightly and on demand only
# (never on PRs: each suite stands up dozens-to-100 containers and takes many minutes).
#
# ── Runner setup (one-time) ───────────────────────────────────────────────────────────────────
# Register the scale box as a repo self-hosted runner (Settings → Actions → Runners → New) and
# give it the label `mycelium-scale` in addition to the default `self-hosted`. This job is scoped
# to that label so it ONLY ever runs on the designated machine — it will never fall onto some other
# self-hosted runner. The runner needs Docker + docker-compose + make + the Rust toolchain. Because
# it is self-hosted, each suite tears its cluster down (`down -v`) before and after, and an
# always-run cleanup step below removes anything a mid-run failure orphaned, so the box stays clean
# for the next run.
name: Scale suites (nightly, self-hosted)

on:
  schedule:
    - cron: '0 6 * * *'   # nightly 06:00 UTC — after the hosted cluster suites (05:00)
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which scale suite to run'
        type: choice
        default: all
        options: [all, scale, resilience, entries]

# One scale run at a time on the single self-hosted box — never let a nightly and a manual dispatch
# collide over the same Docker daemon.
concurrency:
  group: scale-nightly
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  # ── Is there any scale evidence at all? ───────────────────────────────────────────────────────
  #
  # The job below runs only on a self-hosted box labelled `mycelium-scale`. When that box is
  # offline the run does not fail — it sits **queued**, indefinitely, and eventually expires as
  # "cancelled". On the runs list that looks like activity. It is the opposite: it is the absence
  # of evidence, rendered as a spinner.
  #
  # That is exactly what happened between 2026-09-10 and 2026-09-15: every nightly in that window
  # produced nothing — four expired as "cancelled", two were still queued days later — while the
  # contracts work landed, and nobody noticed, because nothing ever went red. (Queued-not-failed is
  # consistent with no runner carrying the label being online; the runner list itself needs admin
  # scope to read, so that part is inference, not something this repo can check.)
  # The plan's own words are "nothing scale-related can be evidenced until it is green"
  # (docs/plans/v3-contracts-axis.md §10, item 8), so a silent gap is the one failure mode that matters.
  #
  # This hosted job cannot start the box, and does not pretend to. It asks a narrower question —
  # *when did this workflow last actually succeed?* — and goes red when the answer is "too long
  # ago" or "never". An alarm that fires on the absence of a signal, rather than on a bad signal,
  # because absence is what this has been failing at.
  evidence-freshness:
    name: Scale evidence freshness (hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if the last successful scale run is stale
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_DAYS: '3'
        run: |
          set -euo pipefail
          last=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/scale-nightly.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].updated_at // empty' 2>/dev/null || true)
          if [ -z "$last" ]; then
            echo "::error::No successful run of the scale suites has ever been recorded."
            echo "Nothing scale-related can be evidenced until this goes green. The scale job runs"
            echo "only on a self-hosted runner labelled 'mycelium-scale' (see the header of this"
            echo "workflow for the one-time setup); while that box is offline the job queues"
            echo "silently instead of failing."
            exit 1
          fi
          last_s=$(date -u -d "$last" +%s)
          now_s=$(date -u +%s)
          age_d=$(( (now_s - last_s) / 86400 ))
          echo "Last successful scale run: $last (${age_d}d ago; threshold ${MAX_AGE_DAYS}d)."
          if [ "$age_d" -gt "$MAX_AGE_DAYS" ]; then
            echo "::error::Scale evidence is ${age_d} days old (threshold ${MAX_AGE_DAYS})."
            echo "The likely cause is that the self-hosted 'mycelium-scale' runner is offline, in"
            echo "which case the scale job below is queued rather than failing. Check"
            echo "Settings -> Actions -> Runners. Until this is green, treat every scale claim in"
            echo "the docs as unevidenced."
            exit 1
          fi
          echo "Scale evidence is current."

  scale:
    name: Scale suites (100-node + resilience + entries)
    runs-on: [self-hosted, mycelium-scale]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # 100 nodes: 1 seed + 99 workers + mgmt + runner. The convergence/anti-entropy hot path at
      # the scale the small suites can't reach.
      - name: Scale — 100 nodes (make test-scale)
        if: ${{ github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'scale' }}
        run: make test-scale

      # ~22 nodes: crash / rejoin / anti-entropy / churn.
      - name: Scale — resilience (make test-scale-resilience)
        if: ${{ github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'resilience' }}
        run: make test-scale-resilience

      # ~30 nodes: entry-volume axis (large KV corpus, write pressure).
      - name: Scale — entries (make test-scale-entries)
        if: ${{ github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'entries' }}
        run: make test-scale-entries

      # Always leave the box clean — the make targets clean on success, this catches a mid-run abort.
      - name: Tear down scale clusters (always)
        if: always()
        run: |
          make test-scale-clean || true
          make test-scale-resilience-clean || true
          make test-scale-entries-clean || true
