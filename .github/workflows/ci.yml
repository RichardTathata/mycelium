name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: RUSTSEC advisories land without any code change (M2 Run-19
    # found two applicable advisories that no push-triggered gate could
    # have caught). Monday 06:00 UTC.
    - cron: '0 6 * * 1'

# One pipe for stdout and stderr in every bash step, so a log keeps cargo's "Running <target>" header next
# to the results it introduces — the test-coverage job reads them in order (scripts/ci-merge-stderr.sh).
env:
  BASH_ENV: ${{ github.workspace }}/scripts/ci-merge-stderr.sh

jobs:
  documentation:
    name: Documentation coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: ./scripts/check-positioning.sh
      - run: python3 scripts/test-check-materials.py
      - run: python3 scripts/test-check-front-doors.py
      - run: python3 scripts/test-check-feature-pages.py

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      # Socket-binding suites go through the flake tier (scripts/ci-retest.sh): a wall-clock
      # flake no longer reds main, but every flake is a loud annotation — never silent.
      # `test-frame-filter`: the test-only receive-path frame filter the row-A interleaving tests withhold
      # real frames with (`agent::lock_lifecycle_tests`, `agent::lock_lifecycle_review_tests`). Only lib
      # test runs enable it — never `test-support` — so examples and demo images do not compile it.
      - run: ./scripts/ci-retest.sh --lib --features test-frame-filter
      - run: ./scripts/ci-retest.sh --lib --features tls,metrics,a2a,llm,test-frame-filter
      # STRICT, no retry: the shutdown-delivery tests (the shutdown-sweep flake, #650), by name. They also
      # run in the flake tier above, by discovery; here a failure is never retried. Seven hold one place on
      # the outbound path open with a test pause or check the count itself, so they are deterministic. Three
      # are the older probabilistic tests of the same contract (`a_fast_reassert_…`, `soft_state_with_a_live_
      # handle_…`, `a_capability_retracted_…`): a residual flake in them turns this step red, deliberately —
      # a tombstone lost at shutdown is the defect, not noise. Each name must report `ok`, so a renamed or
      # removed test fails the step instead of dropping out of it.
      - run: |
          set -o pipefail
          names="a_capability_retracted_at_shutdown_reaches_the_peers
          soft_state_with_a_live_handle_at_shutdown_is_retracted_at_the_peers
          a_fast_reassert_does_not_undo_the_shutdown_sweep
          a_frame_a_writer_holds_at_shutdown_still_reaches_the_peer
          a_frame_a_writer_holds_at_shutdown_is_written_before_shutdown_returns
          a_frame_in_a_slow_connect_at_shutdown_still_reaches_the_peer
          a_frame_a_shard_worker_holds_at_shutdown_still_reaches_the_peer
          frames_dropped_to_a_dead_peer_do_not_hold_shutdown
          an_undeliverable_frame_holds_shutdown_only_for_the_bound
          a_busy_pair_returns_its_outbound_count_to_zero"
          cargo test --lib --features tls,metrics,a2a,llm,test-frame-filter -- --exact $(for n in $names; do echo "lib_tests::$n"; done) 2>&1 | tee shutdown-delivery.log
          for n in $names; do grep -q "^test lib_tests::$n ... ok$" shutdown-delivery.log || { echo "::error::shutdown-delivery test $n did not pass"; exit 1; }; done
      # WS1 RBAC + WS2 audit + WS4 OIDC + WS5 rotation. Listed as a gate in
      # testing.md and run by `make check` since v2.1 — but never in CI until
      # 2026-07-21 (wiki-lint finding: local green masked the gap, the exact
      # make-check-vs-CI-green family).
      # `a2a` joins `compliance` here because the AE evidence tests need both: the audit
      # chain lives behind `compliance` and the A2A enforcement point behind `a2a`, and
      # neither standard gate built the pair — so a test of the two together silently
      # never ran. Widening an existing gate can only catch more.
      # STRICT: the audit chain and both gateway enforcement points are a security gate, and a
      # security gate that goes green on an isolated retry has not passed. The retry still runs
      # (it is diagnostic) and is still annotated, but it fails the job.
      - run: CI_RETEST_STRICT=1 ./scripts/ci-retest.sh --lib --features compliance,a2a
      # Consensus-free embed: gateway without the consensus feature must still
      # test green (a minimal-embed node forwards PROPOSE/VOTE/COMMIT without
      # running them). Same 2026-07-21 gap closure.
      - run: ./scripts/ci-retest.sh --lib --no-default-features --features gateway
      # mycelium-core (the substrate: codec/framing/hlc/store/swim) — its unit suite was
      # clippy-COMPILED (`clippy -p mycelium-core --lib --tests`) but never RUN: `--lib` above
      # tests only the root `mycelium` package (core is a compiled dependency there, so its
      # `#[cfg(test)]` code is invisible). Same class of gap as the mini-fuzz below (M2 Run-20).
      # Includes the wire back-compat gate (`decode_wire_v11_*`) — the rolling-upgrade contract.
      - run: ./scripts/ci-retest.sh -p mycelium-core
      # mycelium-sim (item 6's replay harness). Added with the crate, not after it: a crate
      # with no gate is the "a job nobody runs never goes red" family, which this repository
      # has already paid for once. Its own gate is the same-length/different-content
      # divergence test — a harness that passes that unchanged is only re-seeding.
      - run: ./scripts/ci-retest.sh -p mycelium-sim
      # Item 6's decisive demonstration (plan §12.1), run rather than only built — see the
      # receipt-ladder step below for why the gallery is gated on running.
      - run: scripts/example-case.sh cargo run -p mycelium-sim --example replay_a_bundle
      # And the seams under `sim`: without this the routed path is never built in CI, and
      # `sim_seam` would be a module that compiles only on the author's machine.
      - run: ./scripts/ci-retest.sh -p mycelium-core --features sim
      # Core's `tls`-gated unit tests (erasure's crypto-shred, tls's key extraction, framing's TLS cases)
      # ran in no step until 2026-10-06 — found by the test inventory once it counted library unit tests.
      - run: ./scripts/ci-retest.sh -p mycelium-core --features tls
      # In-suite decoder mini-fuzz (gated behind fuzz-internals). The fuzz/
      # targets existed for the whole project's life but were never executed
      # in CI, and an unbounded-allocation decode DoS sat uncaught (M2 Run-20).
      # The AE seam's replaceable-evaluator premise: an evaluator written in *another crate* must
      # compile and be able to permit, deny and be undecided. `--lib` would never catch a
      # `#[non_exhaustive]` constructor hole, which is how one shipped into review (2026-09-15).
      # Same premise for the operator-built execution authority (`gateway_mandate_external`), added in
      # #399, broken the same day by #417, and unnoticed through the v2.15.0 tag because only the
      # first test was *run* here — a `tests/` binary CI compiles and does not execute is not a gate
      # (external review F9, 2026-09-26). The answer then was to name it too, and naming is what left
      # `declaration_schema`, `wire_check_examples` and `wire_check_fixtures` unrun until 2026-10-06. So:
      # every root integration test, by discovery (verification policy rule 3). A file gated on a
      # feature this line lacks (`decision_trace_replay`, `sim`) compiles empty here and runs below.
      - run: cargo test --features tls,a2a --test '*'
      # The skillrunner binary's unit tests and the crate's doctests ran in no step until 2026-10-06 — one
      # doctest (`lock_service`'s `with_lock`) had stopped compiling. `check-test-inventory.py` found both.
      - run: cargo test --features tls,a2a --bins
      - run: cargo test --features tls,a2a --doc
      - run: cargo test -p mycelium-coop-examples --doc
      # `tls` as well as `fuzz-internals`: two of the trust-edge parsers (the presented
      # credential, the catalogue reply) live behind it, so without it they are not
      # compiled and the mini-fuzz would silently cover two of four.
      - run: cargo test --lib --features fuzz-internals,tls mini_fuzz_decoders_survive_adversarial_bytes
      # Adopter-surface Y4: the span exporter's OTLP side is under `otel`, which no other test line enables — without
      # this its test (`what_reaches_the_exporter_is_the_pinned_set_and_no_input`) compiles in the universe and runs
      # nowhere. `tls` for the evidence half (the journal exists only where the evaluator seam does).
      - run: cargo test --lib --features otel,tls span_export
      - run: ./scripts/ci-retest.sh -p mycelium-tuple-space --features gateway
      # Examples are the documented contract for the guide chapters; an
      # examples-free CI let a stale include_str! path hide behind cargo's
      # incremental cache for weeks (mesh_demo manifests/ → presets/ rename).
      - run: cargo build --examples --features tls,metrics,a2a,llm
      # The v3 axis' **decisive demonstrations** (plan §12.1) are *run*, not just built. Building
      # them proves the API still compiles; running them proves the demonstration still
      # demonstrates — which is the thing the gallery is a gate on. They are self-contained, take
      # seconds, and exit non-zero if a step panics.
      - run: scripts/example-case.sh cargo run --example receipt_ladder
      # Coordination integrity (2026-09-24): the electorate rule, the leadership rung and the
      # fence, as one narrative. Each act asserts, so a regression fails the job rather than
      # printing a nice story about a substrate that no longer behaves that way.
      - run: scripts/example-case.sh cargo run --example coordination_integrity
      - run: scripts/example-case.sh cargo run --example coordinator_by_accretion
      # Identity travels as one record; two proof-requiring nodes still authenticate. The race it
      # prevents needs two processes, so that half stays in the Docker suites — the example says so
      # rather than narrating a race it never runs.
      - run: scripts/example-case.sh cargo run --example identity_one_record --features tls,compliance
      # The three questions an auditor asks. Each act asserts — including that an edited audit
      # chain FAILS to verify, which is the one a "trust us" answer cannot make checkable.
      - run: scripts/example-case.sh cargo run --example auditor_questions --features tls,compliance
      # Closure plan C12: the stop, measured. Admit calls under a mandate, revoke it, and check T_admit
      # and T_drain on a live node against the bound the class declares.
      - run: scripts/example-case.sh cargo run --example authority_drain --features compliance
      # Policy at the gateway, per MCP tool call. Five acts: permitted-and-executed, denied on an
      # argument value, denied by remit, and twice INDETERMINATE — which refuses. The fourth act
      # is the gate: an unmapped tool must never fall through to permit.
      - run: scripts/example-case.sh cargo run --example mcp_tool_authority --features tls,compliance
      # composed-effect.md §9's demonstration: permitted at the gateway, refused at the resource.
      - run: scripts/example-case.sh cargo run --example composed_commit --features tls,compliance
      # The OTHER door, and the unguarded one: `/a2a` requires no bearer, so the evaluator is the
      # whole gate there. Seven acts, including the streaming path — a refusal must arrive as a
      # `failed` task event and CLOSE the stream, not leave a subscriber waiting on silence.
      - run: scripts/example-case.sh cargo run --example a2a_skill_authority --features tls,a2a
      - run: scripts/example-case.sh cargo run --example knowledge_layer --features tls
      # Strict eligibility from the shipped history source: an appointing authority's signed heads, a
      # reader's checkpoint, and each verdict asserted — including `Unknown` for a missing record and for
      # a reader with no checkpoint, the cases where "unknown is never eligible" is the whole point.
      - run: scripts/example-case.sh cargo run --example strict_eligibility --features tls
      - run: scripts/example-case.sh cargo run --example federated_domains --features tls
      # The third domain: the question two domains cannot ask. Each act asserts, so "trust does
      # not compose" stays a property rather than a paragraph.
      - run: scripts/example-case.sh cargo run --example federation_trust_is_not_transitive --features tls

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The DEFAULT feature set (cli+gateway+consensus, no tls): an item live only under
      # `tls` is dead here — the matrix line below and `--no-default-features` both missed
      # `consensus::signer_authorized` (v2.4.1 release day finding).
      - run: cargo clippy --lib --tests -- -D warnings
      - run: cargo clippy --lib --tests --features test-frame-filter -- -D warnings
      # Full feature matrix — `--lib --tests` alone misses code behind
      # #[cfg(feature = "tls")] etc. (same set CLAUDE.md mandates locally).
      - run: cargo clippy --lib --tests --features tls,metrics,a2a,llm -- -D warnings
      # Compliance-gated code (WS1–WS5) is invisible to the line above; `make check` has
      # linted it since 2026-07-22 but CI never did (2026-09-04 wiki-lint finding).
      - run: cargo clippy --lib --tests --features compliance -- -D warnings
      # `otel` and the two bench targets were built by no CI step until post-360 row J (2026-10-12) — only
      # the test-universe job's `--all-features -- --list` compile touched them, which is neither a lint nor
      # a build of the feature on its own. `gateway_overhead` requires `gateway,test-util`; `throughput` is
      # also checked by the embedded job's `cargo check --all-targets --no-default-features`.
      - run: cargo clippy --lib --tests --features otel,tls -- -D warnings
      - run: cargo clippy --benches --features gateway,test-util -- -D warnings
      - run: cargo clippy -p mycelium-tuple-space --features gateway,metrics --all-targets -- -D warnings
      # Core's own test code is a separate lint scope (`-p mycelium-core --lib
      # --tests`): the Test job RUNS core's suite but nothing linted it after
      # the 2026-07-11 restructure left this only in a comment (2026-07-21
      # wiki-lint finding; `make check` had it all along).
      - run: cargo clippy -p mycelium-core --lib --tests -- -D warnings
      - run: cargo clippy -p mycelium-sim --all-targets -- -D warnings
      # The seams' OTHER arm. `mycelium-sim` is the harness; the code that ROUTES through it lives
      # in `mycelium-core` behind `--features sim`, and until now nothing linted that arm — the Test
      # job runs its suite, which is not the same claim. Third instance of this family (compliance
      # 2026-09-04, core tests 2026-07-21): a feature whose code is tested but never linted.
      - run: cargo clippy -p mycelium-core --lib --tests --features sim -- -D warnings
      # The static forbidden-call check (item 6 PR 3, D12). Runs in the same job as clippy
      # because it is the same kind of claim: the seams cannot erode while PR 4-7 are built.
      - run: ./scripts/check-sim-seams.sh
      - run: python3 scripts/check-causal-doors.py
      - run: python3 scripts/check-causal-doors.py --self-test
      # …and the check recognises every timer-alias spelling (planted files; #602's re-review).
      - run: ./scripts/test-check-sim-seams.sh
      # Verification policy rule 3, checked positively: every test requirement in the repository — each
      # crate's library, integration, binary and doc tests under every cfg gate on test code, Python and
      # TypeScript files (live ones only with their *_LIVE_REQUIRED guard set), fuzz targets — maps to a CI
      # step that would run it (CLAUDE.md § Verification policy). The second line is the check's own
      # mutation suite: each bypass an adversarial review found must fail it.
      - run: ./scripts/with-pyyaml.sh scripts/check-test-inventory.py
      - run: ./scripts/with-pyyaml.sh scripts/test-check-test-inventory.py
      # The same rule for single demonstrations: every `cargo run … --example` in this workflow goes through
      # scripts/example-case.sh (a case the test-coverage job sees executed), and examples/README.md's CI column
      # names, for each ✓ row, a step that executes it — and no step executes an example whose row says ·.
      - run: ./scripts/with-pyyaml.sh scripts/check-example-matrix.py
      - run: ./scripts/with-pyyaml.sh scripts/test-check-example-matrix.py
      - run: python3 scripts/test-ci-test-coverage.py
      - run: ./scripts/test-ci-retest.sh
      # Closure plan C11: no new unclassified read of Hlc::current(), which stands still on a quiet
      # node and fails a deadline check open.
      - run: ./scripts/check-hlc-current.sh
      # The KV namespace sweep (item 2 PR 1, D7). The plan asserted this check existed before it did;
      # an invariant nothing runs is a sentence. Foreign state never enters the gossip medium — and, since
      # 2026-10-10, every KV prefix in production code has a src/lib.rs row or a declared non-key (the
      # wiki lint missed live prefixes five times). The self-test plants rowless prefixes and requires
      # the gate to name each.
      - run: ./scripts/check-kv-namespaces.sh
      - run: ./scripts/check-kv-namespaces.sh --self-test
      - run: ./scripts/check-wiki-mutation-fence.sh
      # Post-360 plan row F: every locally-originated KV write leaves through `make_kv_wire_msg`, so a
      # TLS node signs it — a bare `Data` frame at a write site would be refused by a fleet that
      # requires signed frames. The self-test plants one and requires the gate to name it.
      - run: ./scripts/check-signed-dispatch.sh
      - run: ./scripts/check-signed-dispatch.sh --self-test
      # The knowledge layer's SEMANTIC gate (item 3) — a Phase D exit condition. Its own step so the
      # exit condition is visible, rather than three tests inside a suite of hundreds. This is not
      # the behavioural claim (§13, research track).
      - run: make gate-knowledge

  embedded:
    name: Gateway-free build (no default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --bins --tests too: the `mycelium` binary once failed to compile without `cli` (its tracing-subscriber) and
      # this line, being --lib only, never saw it.
      - run: cargo clippy --lib --bins --tests --no-default-features -- -D warnings
      # The line above is NOT a gateway-free lint: `--tests` builds the dev-dependencies, and
      # `mycelium-tuple-space` (`gateway`) and `mycelium-effects` (`envelope` -> `gateway` + `tls`) switch
      # both features back on for the whole invocation. With no test target, this one lints the library
      # with the gateway really off -- the catcher for code used only under `gateway`/`tls`, which is dead
      # here (lint 2026-10-06; `make check` has run it locally since 2026-07-03).
      - run: cargo clippy --lib --no-default-features -- -D warnings
      # `metrics` without `gateway` (row J, 2026-10-12): no step built it, and `mod emergent`'s dead-code allowance
      # (`not(any(gateway, metrics))`) left the gateway-only explain items dead there — found by the wiki's `metrics` lint.
      - run: cargo clippy --lib --no-default-features --features metrics -- -D warnings
      # Every target compiles without default features: an example that uses an optional feature must declare it as
      # `required-features`, or this fails. A compile check, not clippy: examples have never been linted in CI.
      - run: cargo check --all-targets --no-default-features
      # The only tests that run against `mycelium` without `gateway` (realignment repairs R8). They live in
      # their own crate because `mycelium`'s dev-dependencies enable `gateway`, so its own test build never
      # lacks it; run alone, this crate builds `mycelium` with no default features. Its first test fails if
      # the gateway was unified back in.
      - run: cargo clippy -p mycelium-gateway-free-tests --all-targets -- -D warnings
      - run: cargo test -p mycelium-gateway-free-tests
      # The same for `tls`: `mycelium`'s dev-dependencies enable it, so its own test build never lacks it. Run alone,
      # this crate builds `mycelium` with `gateway` and without `tls`; its first test fails if `tls` was unified in.
      - run: cargo clippy -p mycelium-tls-free-tests --all-targets -- -D warnings
      - run: cargo test -p mycelium-tls-free-tests
      # The node binary's recorded-run path (`GOSSIP_RECORD_BUNDLE_DIR`) exists only under `sim`;
      # nothing else builds the bin with it, so this is the line that keeps it compiling — and, since
      # adopter-surface X6, the binary `test --faults replay` needs: the co-op fixture's fleet recorded under the
      # kernel and replayed decision for decision (the other half of the exit, the build without `sim`, is the
      # `Scaffold` job's `not_in_build`).
      - run: cargo build --bin mycelium --features cli,sim
      - run: |
          set -euo pipefail
          ./target/debug/mycelium test --faults replay tests/fixtures/units/coop --library tests/fixtures/units/artifacts | tee replay.log
          grep -q '^replay: passed' replay.log
          grep -q '✓ unit `dispatcher`: the replay consumes the whole recording and decides decision for decision' replay.log
          # The partition class against a declaration with a governed group (#675's review, finding 3): the dark
          # worker evicted, its offer gone after 3 × ttl_secs, the seat re-filled by the other worker's own join.
          ./target/debug/mycelium test --faults partition tests/fixtures/units/faults-group | tee partition.log
          grep -q '^partition: passed' partition.log
          grep -q '✓ the governed group `pool` is re-filled by a survivor after its member goes dark — no survivor held a seat at the cut' partition.log
      - run: cargo test --features sim,test-util --test faults_replay
      # Adopter-surface X9's seamed form: the recovery class's two phases recorded into the corpus and replayed against
      # a fresh fleet with the destination reached zero times; a fresh recording compared with the corpus choice for
      # choice (re-record with MYCELIUM_RECORD_CORPUS=1 when a change is intended).
      - run: cargo test --features sim,test-util,tls --test faults_recovery_replay
      # The claims `what-is-proven.md` rests on these two for: a recording carries its decisions into the
      # bundle and explains (the comparison's recording half), and the traced provisioner makes no extra
      # draw under the replay seams (draw-count equivalence) — hand-run only until doc-coverage run 19.
      # Its own step: `sim` turns the replay seams on, and no other root integration test runs under it.
      - run: cargo test --features sim,test-util --test decision_trace_replay
      - run: cargo test -p mycelium-wasm-host --features stem,sim --lib the_trace_makes_no_extra_draw_under_the_replay_seams
      # The offline wire-check over the checked-in fixtures (design-time-tooling.md W2): the co-op
      # deployment is green with its library; the unwired one must exit 1 naming its ghost.
      - run: cargo run --features cli --bin mycelium -- wire-check tests/fixtures/units/coop --library tests/fixtures/units/artifacts
      - run: |
          if cargo run --features cli --bin mycelium -- wire-check tests/fixtures/units/unwired; then
            echo "the unwired fixture must fail the check"; exit 1
          fi
      # W4: a governed edge no declaration could authorise, exit 1.
      - run: |
          if cargo run --features cli --bin mycelium -- wire-check tests/fixtures/units/unauthorised; then
            echo "the unauthorised fixture must fail the check"; exit 1
          fi
      # F2 (D20): a proposed artifact is reported as *would bind after acceptance*, a warning.
      - run: cargo run --features cli --bin mycelium -- wire-check tests/fixtures/units/coop --library tests/fixtures/units/artifacts-proposed | grep -q "would bind after acceptance"
      # X1: every example's declaration directory checks clean (examples/units/*).
      - run: scripts/wire-check-examples.sh
      # W3: the schema window and an unknown schema, both named, exit 1.
      - run: |
          if cargo run --features cli --bin mycelium -- wire-check tests/fixtures/units/schema-window --schemas tests/fixtures/units/schemas; then
            echo "the schema-window fixture must fail the check"; exit 1
          fi

  wasm-host:
    # WS-E M12 companion crate. Its own job: it pulls wasmtime (large first
    # build; rust-cache amortises it) and runs in parallel so it never blocks
    # the main test/clippy jobs. wasmtime is confined here — never in mycelium /
    # mycelium-core (the WS-A dep-tree invariant).
    name: WASM host (WS-E M12)
    runs-on: ubuntu-latest
    # S2's S3-compatible fixture (design-time-tooling.md §11): Adobe's S3Mock with one bucket made
    # from its environment (MinIO's images are no longer publicly pullable from Docker Hub or
    # quay.io — three pulls failed before this). The object-store test runs against it through
    # MYCELIUM_S3_TEST_URL; without the variable the same test exercises the adapter over file://
    # and says so.
    env:
      # Post-360 row M: the confined-activation tests show Landlock and seccomp on this runner; with the
      # variable set, a runner that cannot confine fails them instead of skipping green.
      MYCELIUM_CONFINE_LIVE_REQUIRED: "1"
      MYCELIUM_S3_TEST_URL: s3://mycelium-test/library
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT: http://localhost:9090
      AWS_ALLOW_HTTP: "true"
      AWS_REGION: us-east-1
      # S3 (design-time-tooling.md §11): the test also takes MYCELIUM_GCS_TEST_URL, but no GCS
      # emulator runs here — fake-gcs-server's XML API accepts only signed-URL uploads
      # (X-Goog-Algorithm in the query), and object_store 0.14 puts with a plain PUT under a bearer,
      # so two CI runs ended at "invalid uploadType". The GCS gate is a real bucket (S4).
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/ci-retest.sh -p mycelium-wasm-host
      # Every wasm-host test gated on `stem`, `gateway` or `llm` — `rule_catalogue` (the rule catalogue's gate,
      # claimed "gated in CI" since v2.20.0), `gateway` (signed entries across two nodes), the provisioner's
      # gateway tests and the stem's `[[serve]]` tests — ran in no step until 2026-10-06: no wasm-host step
      # enabled those features without a name filter.
      - run: ./scripts/ci-retest.sh -p mycelium-wasm-host --features stem,gateway,llm
      # #641's review, round 4 (N1): a write root's filesystem mounted a second time (a bind mount). The test
      # mounts, so it runs alone, as root, in a mount namespace of its own; its guard makes a failure to
      # mount a failure rather than a skip. The binary is the one the first step built.
      - name: Confinement beside a bind mount (sudo unshare -m)
        run: |
          bin=$(cargo test -p mycelium-wasm-host --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.kind == ["lib"] and .executable != null) | .executable' | head -1)
          test -x "$bin"
          sudo env MYCELIUM_CONFINE_LIVE_REQUIRED=1 MYCELIUM_CONFINE_MOUNT_LIVE_REQUIRED=1 \
            unshare -m --propagation private "$bin" --exact \
            activation_sandbox::tests::a_symlink_on_a_second_mount_of_a_write_roots_filesystem_is_not_followed
      # #644's round-3 review: the egress proxy closes at accept a connection another user's process opened. The
      # test connects as `nobody` through passwordless sudo; its guard makes a missing sudo a failure, not a skip.
      - name: Egress proxy refuses another user's connection (sudo -u nobody)
        run: |
          bin=$(cargo test -p mycelium-wasm-host --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.kind == ["lib"] and .executable != null) | .executable' | head -1)
          test -x "$bin"
          MYCELIUM_EGRESS_OTHER_UID_LIVE_REQUIRED=1 "$bin" --exact \
            activation_egress::tests::another_users_connection_is_closed_at_accept
      # The S3-compatible fixture: MinIO in a container, one bucket made with the runner's AWS CLI.
      - name: Start an S3-compatible store with the test bucket
        run: |
          docker run -d --name s3mock -p 9090:9090 -e initialBuckets=mycelium-test adobe/s3mock
          for i in $(seq 1 30); do
            curl -sf http://localhost:9090/ >/dev/null && break
            sleep 1
          done
          # The image's initialBuckets did not create the bucket on the first run (NoSuchBucket on
          # PUT), so make it explicitly with the runner's AWS CLI and list what the store holds.
          aws --endpoint-url http://localhost:9090 s3api create-bucket --bucket mycelium-test || true
          aws --endpoint-url http://localhost:9090 s3 ls
      # The object-store adapter against that bucket, plus clippy with every feature.
      - run: cargo test -p mycelium-wasm-host --features object_store,stem object_store_source -- --nocapture
      - run: cargo clippy -p mycelium-wasm-host --all-targets --features object_store,stem -- -D warnings
      - name: Beginner stem fleet and declaration consumer
        run: |
          export_dir="$RUNNER_TEMP/first-stem-fleet"
          scripts/example-case.sh cargo run -p mycelium-wasm-host --example first_stem_fleet -- "$export_dir"
          python3 scripts/check-stem-observations.py "$export_dir"
      # S1's resident-memory gate owns the process (it measures RSS), so it runs alone.
      - run: cargo test -p mycelium-wasm-host --lib a_large_blob_stages_to_disk_within_a_memory_bound -- --ignored
      # The stem node binary (design-time-tooling.md §13): opt-in feature, so check it explicitly.
      - run: cargo check -p mycelium-wasm-host --bin mycelium-stem --bin mycelium-artifact --features stem
      - run: cargo clippy -p mycelium-wasm-host --all-targets -- -D warnings

  wasm-host-macos:
    # Post-360 row M (#636's review finding 8): the confined-activation tests on Seatbelt. The Linux job
    # shows Landlock and seccomp; this one shows sandbox-exec. Name-filtered to the confinement tests (the
    # rest of the crate runs on Linux), with the guard set so a runner that cannot confine fails them.
    name: WASM host confinement (macOS Seatbelt)
    runs-on: macos-latest
    env:
      MYCELIUM_CONFINE_LIVE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      # `gateway`: the activation egress proxy's credential case attaches through the node's gate (rows L and M).
      # `peer_uid`: the proxy's accept-time owner check reads the kernel's `pcblist_n` here — its parser tests and
      # `the_kernel_names_this_users_own_loopback_connection` ran on Linux only until 2026-10-19 (v2.36.0's review).
      - run: cargo test -p mycelium-wasm-host --lib --features gateway -- activation confined egress peer_uid
      # Row M's live allow-list through the binary: `mycelium-stem` re-reads its unit file on SIGHUP and the running
      # proxy serves the newly listed host (the Linux job runs it with every other `tests/` file).
      - run: cargo test -p mycelium-wasm-host --features stem --test stem_sighup
      # #644's round-4 review: the egress proxy closes another user's connection on macOS too — the kernel's
      # `pcblist_n` read, not the synthetic buffer. Connects as `nobody` through passwordless sudo; guarded, so a
      # runner without it fails rather than skips.
      - name: Egress proxy refuses another user's connection (sudo -u nobody)
        run: >-
          MYCELIUM_EGRESS_OTHER_UID_LIVE_REQUIRED=1 cargo test -p mycelium-wasm-host --lib --features gateway --
          --exact activation_egress::tests::another_users_connection_is_closed_at_accept

