  scaffold:
    # X2 (docs/plans/adopter-surface.md): `mycelium init` writes a template the binary embeds from `templates/`;
    # this job is the proof that each template builds and runs as a project of its own. The Rust scaffold is
    # built against this checkout by rewriting its dependency to a path — a `[patch]` would still fetch the
    # pinned tag, which does not exist yet on a version-bump commit (#666's review) — so a template that needs an
    # API landing in the same release passes, and the tag it pins is what a user gets. The Python scaffold runs
    # the node built here in place of the published binary; the job prints the target it ran against. The two-domain
    # template (Y8) is a Rust project too and is built the same way.
    name: Scaffold (mycelium init, every template)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo build --bin mycelium --features cli,tls,compliance,llm
      - name: The tag init writes is this binary's version
        run: |
          set -euo pipefail
          ./target/debug/mycelium init "$RUNNER_TEMP/pin-check" --template governed-call
          want="tag = \"v$(sed -n 's/^version *= *"\(.*\)".*/\1/p' Cargo.toml | head -1)\""
          grep -q "$want" "$RUNNER_TEMP/pin-check/Cargo.toml" || { echo "Cargo.toml does not pin $want"; cat "$RUNNER_TEMP/pin-check/Cargo.toml"; exit 1; }
          if ./target/debug/mycelium init "$RUNNER_TEMP/pin-check" --template governed-call; then echo "init overwrote a non-empty directory"; exit 1; fi
      - name: Rust template — init, wire-check, run, explain, doctor, and an edited skill
        run: |
          set -euo pipefail
          BIN="$PWD/target/debug/mycelium"; REPO="$PWD"
          "$BIN" init "$RUNNER_TEMP/governed-call" --template governed-call
          cd "$RUNNER_TEMP/governed-call"
          echo "target: this checkout at $GITHUB_SHA (the scaffold pins $(grep -o 'tag = "[^"]*"' Cargo.toml))"
          sed -i "s|^mycelium = { git = .*|mycelium = { path = \"$REPO\", features = [\"tls\", \"llm\"] }|" Cargo.toml
          grep -q "path = \"$REPO\"" Cargo.toml
          "$BIN" wire-check units/
          CARGO_TARGET_DIR="$REPO/target" cargo run | tee run.log
          grep -q 'ledger=petty-cash: PERMITTED' run.log
          grep -q 'ledger=capital: REFUSED' run.log
          grep -q 'answered: echo: Greet the new joiner warmly' run.log
          grep -q '^evidence: ' run.log
          test -s data/evidence.log
          "$BIN" explain data/decisions.jsonl --catalogue "$REPO/docs/reference/rule-catalogue.json" | tee explain.log
          grep -q 'signal.admission' explain.log
          # X4: the run's records as one chain from the id the scaffold's call carries — the permitted call and the
          # refused one, decided at the provider, each captured; the reader says what the files are.
          "$BIN" explain --correlation run-1 data/evidence.log data/decisions.jsonl | tee chain.log
          grep -q 'journal: ' chain.log && grep -q 'trace: ' chain.log
          grep -q '\[captured\] journal decided' chain.log
          grep -q 'correlation=run-1' chain.log
          n=$(grep -c '^\[captured\]' chain.log); [ "$n" -ge 2 ] || { echo "expected at least two captured records, got $n"; exit 1; }
          "$BIN" doctor node.toml | tee doctor.log; grep -q 'start(): would start' doctor.log
          printf 'Say hello to {{input}} in a pirate voice.\n' > skills/demo/greeting.md
          CARGO_TARGET_DIR="$REPO/target" cargo run | tee run2.log
          grep -q 'answered: echo: Say hello to the new joiner in a pirate voice' run2.log
      - name: Python template — init, run against the node built here, doctor
        run: |
          set -euo pipefail
          BIN="$PWD/target/debug/mycelium"
          pip install -q -e mycelium-py
          "$BIN" init "$RUNNER_TEMP/governed-call-py" --template governed-call-py
          cd "$RUNNER_TEMP/governed-call-py"
          echo "target: the node built in this job at $GITHUB_SHA (not the published image; see the plan's X2 row)"
          # X8: the unit declares its runtime; wire-check says what that runtime carries (the adapter contract's row).
          "$BIN" wire-check units/ | tee wire.log
          grep -q 'unit purchaser (runtime python, mycelium-py): carries tracing, identity propagation, grants, provider-side enforcement, receipts' wire.log
          MYCELIUM_BIN="$BIN" python main.py | tee run.log
          grep -q 'not enforced by this node' run.log
          grep -q 'alice set demo/greeting: PERMITTED' run.log
          grep -q 'reader set demo/greeting: REFUSED 403 — insufficient scope' run.log
          grep -q 'the route needs kv:write' run.log
          "$BIN" doctor node.toml | tee doctor.log; grep -q 'start(): would start' doctor.log
      - name: test --faults — the fault classes against the scaffold's declaration (X6)
        # The classes this build has (`cli,tls,compliance,llm`, no `sim`) against X2's scaffold, with a copy of its
        # configuration that adds `[persistence]` (the template has none — its two nodes share one directory — so
        # against the template itself `restart` reads not_configured, which the page says). The exits of the plan
        # row: every class the build has passes and names the ids it exercised; `replay` reads `not_in_build` naming
        # `sim` and fails the run only when asked for by name; a widened `[[rule]]` is reported by `policy-diff`; a
        # declaration `wire-check` refuses is refused by `test` with the same text, byte for byte.
        run: |
          set -euo pipefail
          BIN="$PWD/target/debug/mycelium"; REPO="$PWD"
          cd "$RUNNER_TEMP/governed-call"
          { cat node.toml; printf '\n[persistence]\nbase_path = "data/faults-persist"\n'; } > faults.toml
          "$BIN" test --faults units --config faults.toml | tee faults.log
          grep -q '^revoke: passed' faults.log
          grep -q '^restart: passed' faults.log
          grep -q '^partition: passed' faults.log
          grep -q '^replay: not_in_build — sim' faults.log
          grep -q '^policy-diff: not_configured' faults.log
          # Adopter-surface X9: selective recovery against the scaffold's declaration — the lost acknowledgement
          # probed before any retry, the closure incomplete then complete, each member recovered by its class.
          grep -q '^recovery: passed' faults.log
          grep -q '✓ the restarted node finds its lost-acknowledgement record unknown in its own ledger, probes before any retry, and the destination holds one effect' faults.log
          grep -q '✓ the destination saw each effect once' faults.log
          # Adopter-surface X3: the scaffold's grant-required tool on its own fleet — default-deny, the declared
          # issuer's grant admitting one call, and the grant holding across a restart over the WAL.
          grep -q '^grant: passed' faults.log
          grep -q '✓ a grant-required tool is default-deny' faults.log
          grep -q '✓ the grant holds across a restart' faults.log
          grep -q 'activation: not_applicable — 0 command(s) declared, 0 run' faults.log
          grep -q 'exercised:.*persist.unreadable_refused enforced' faults.log
          grep -q 'exercised:.*mesh.signed_writes enforced' faults.log
          grep -q 'exercised:.*membership.governed instrumented' faults.log
          grep -q 'exercised:.*id.revocation_authority not_configured' faults.log   # driven by the class; resolved not_configured under the development posture (the CA key on the node)
          grep -q 'not exercised:.*ae.preflight not_run (not_configured: --against' faults.log
          # Asked for by name, a class this build lacks fails the run.
          if "$BIN" test --faults replay units --config faults.toml; then echo "replay without sim passed"; exit 1; fi
          # The planted policy regression: the rule's requires_values dropped in the proposed revision.
          cp -r units units-wide && sed -i '/requires_values/d' units-wide/purchaser.toml
          if "$BIN" test --faults policy-diff units --config faults.toml --against units-wide | tee diff.log; then echo "the widened rule was not reported"; exit 1; fi
          grep -q 'permits and the declared one refused' diff.log
          grep -q 'tools/call tool:purchase.place' diff.log
          "$BIN" test --faults policy-diff units --config faults.toml --against units | tee same.log
          grep -q '^policy-diff: passed' same.log
          # A declaration wire-check refuses is refused by test, with the same findings.
          "$BIN" wire-check "$REPO/tests/fixtures/units/unwired" > wc.txt || true
          if "$BIN" test --faults "$REPO/tests/fixtures/units/unwired" > tf.txt 2> tf.err; then echo "test ran an unwired declaration"; exit 1; fi
          diff wc.txt tf.txt
          grep -q 'wire-check refused the declaration; nothing ran' tf.err
      - name: declare — a unit edit under the watch reaches the fleet, a refused one does not (X10)
        run: |
          set -euo pipefail
          BIN="$PWD/target/debug/mycelium"
          cd "$RUNNER_TEMP/governed-call-py"
          trap 'echo "--- watch.log"; cat watch.log 2>/dev/null || true; echo "--- node.log"; tail -40 data/node.log 2>/dev/null || true' ERR
          "$BIN" -c node.toml > data/node.log 2>&1 &
          NODE=$!
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8300/health > /dev/null && break; sleep 0.5; done
          resolve() { curl -sf -H 'Authorization: Bearer alice-token' 'http://127.0.0.1:8300/gateway/capability/resolve?ns=purchase&name=place'; }
          "$BIN" declare . --token alice-token | tee declare.log
          grep -q 'declared 1 unit(s)' declare.log
          resolve | grep -q '"ledger":"petty-cash"'
          "$BIN" declare . --token alice-token --watch --poll-ms 200 > watch.log 2>&1 &
          WATCH=$!
          sleep 1
          sed -i 's/ledger = "petty-cash"/ledger = "petty-cash-edited"/' units/purchaser.toml
          for _ in $(seq 1 40); do resolve | grep -q '"ledger":"petty-cash-edited"' && break; sleep 0.25; done
          resolve | grep -q '"ledger":"petty-cash-edited"'
          printf 'principal = "b"\n[[requirement]]\nns = "nobody"\nname = "offers"\n' > units/b.toml
          sleep 1
          grep -q 'refused: wire-check found' watch.log
          resolve | grep -q '"ledger":"petty-cash-edited"'   # the previous declaration stands
          kill -INT "$WATCH"; wait "$WATCH" || true
          cat watch.log
          grep -q 'retracting' watch.log
          kill "$NODE"; wait "$NODE" || true
      - name: Two-domain template — four nodes under secure-multi-domain, the cross-edge call and each refusal (Y8)
        # Adopter-surface Y8: two fleets, each its own domain — CAs minted and certificates issued off-node by this
        # job's `mycelium` (`tls ca`, `tls issue`, `tls pin`), named tokens, egress lists naming the partner, a pinned
        # key — and one export called across the edge by a named local caller. The node program is the template's,
        # built against this checkout as the Rust template is (the dependency rewritten to a path); `secure-multi-domain`
        # is in no published tag before the next MINOR release (v2.38.2 is a PATCH without it), so the tag the scaffold pins cannot build it yet.
        run: |
          set -euo pipefail
          BIN="$PWD/target/debug/mycelium"; REPO="$PWD"
          "$BIN" init "$RUNNER_TEMP/two-domains" --template two-domains
          cd "$RUNNER_TEMP/two-domains"
          echo "target: this checkout at $GITHUB_SHA (the scaffold pins $(grep -o 'tag = "[^"]*"' Cargo.toml))"
          sed -i "s|^mycelium = { git = .*|mycelium = { path = \"$REPO\", features = [\"tls\", \"a2a\", \"compliance\"] }|" Cargo.toml
          grep -q "path = \"$REPO\"" Cargo.toml
          export MYCELIUM="$BIN" CARGO_TARGET_DIR="$REPO/target"
          NODE_BIN="$CARGO_TARGET_DIR/debug/two-domains"
          trap 'bash fleet.sh stop || true; for f in data/*.log; do echo "--- $f"; tail -n 30 "$f"; done' EXIT
          bash fleet.sh setup
          test -s exchange/foodbank-gw.pin && test -s exchange/kitchen-gw.pin && test -s exchange/kitchen.example.pub
          # No node directory holds a CA key, or another node's key; every key, seed and token file is owner-only.
          for n in foodbank-gw foodbank-1 kitchen-gw kitchen-1; do
            test "$(ls certs/$n | grep -c 'key.pem')" = 1 && ! test -e "certs/$n/ca-key.pem"
          done
          for f in ca/*/ca-key.pem certs/*/*.key.pem secrets/*; do
            test "$(stat -c %a "$f")" = 600 || { echo "$f is $(stat -c %a "$f"), not 600"; exit 1; }
          done
          bash fleet.sh start-all
          bash fleet.sh connect kitchen-gw | tee connect.log; grep -q '"link":"ready"' connect.log
          bash fleet.sh connect foodbank-gw | tee connect-back.log; grep -q '"link":"ready"' connect-back.log
          # The cross-edge call, each way: the local caller's name reaches the provider in the other domain.
          bash fleet.sh call kitchen-gw pantry/stock | tee call.log
          grep -q '^200 ' call.log
          grep -q 'for federation:kitchen.example/token:kitchen/planner' call.log
          bash fleet.sh call foodbank-gw menu/today 'menu?' | tee call-back.log
          grep -q "for federation:foodbank.example/token:foodbank/steward: today's menu" call-back.log
          # Carried from Y7 (#691): each gateway holds a client and an edge, and its own report, read while it runs, shows
          # every federation fact enforced — the client side's fed.pinned, fed.caller_named and fed.partner_egress too.
          for g in kitchen-gw foodbank-gw; do
            bash fleet.sh guarantees "$g" | cut -d' ' -f2- > "guarantees-$g.json"
            python3 - "guarantees-$g.json" "$g" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          assert r["profile"]["name"] == "secure-multi-domain" and r["profile"]["selected"], r["profile"]
          state = {e["id"]: e["resolution"]["state"] for e in r["entries"]}
          fed = [g for g in r["profile"]["required"] if g.startswith("fed.")]
          assert len(fed) == 7 and all(state[g] == "enforced" for g in fed), {g: state[g] for g in fed}
          unmet = [g for g in r["profile"]["required"] if state[g] not in ("enforced", "not_applicable")]
          assert not unmet, unmet
          print(f"{sys.argv[2]}: the seven fed.* enforced; every other requirement enforced or not applicable")
          PY
          done
          # An exceeded slot cap: three concurrent calls against a cap of two, one refused at the edge, not queued.
          for i in 1 2 3; do bash fleet.sh call kitchen-gw pantry/reserve "reserve $i" > "reserve-$i.log" || true & done; wait
          cat reserve-*.log
          test "$(cat reserve-*.log | grep -c 'already carrying 2 calls for kitchen.example')" = 1
          test "$(cat reserve-*.log | grep -c '^200 ')" = 2
          # A body rewritten after it was signed, refused at the food bank's edge.
          "$NODE_BIN" tamper kitchen-gw pantry/stock | tee tamper.log
          grep -q 'binds a different request body' tamper.log
          # Every node's doctor, over the node as the program builds it: green under the profile. The nodes are stopped
          # first: the doctor attaches what the program attaches, the node's evidence journal included, which a running
          # node holds.
          bash fleet.sh stop
          for n in foodbank-gw foodbank-1 kitchen-gw kitchen-1; do
            bash fleet.sh doctor "$n" > "doctor-$n.log"
            grep -q '^profile: secure-multi-domain rev 1$' "doctor-$n.log"
            grep -q '^start(): would start$' "doctor-$n.log" || { cat "doctor-$n.log"; exit 1; }
          done
          # A domain's signing seed is read by its gateway alone: with it gone, the members still build and would start,
          # and the gateway refuses naming the file.
          mv secrets/foodbank.example.seed secrets/kitchen.example.seed "$RUNNER_TEMP/"
          for n in foodbank-1 kitchen-1; do bash fleet.sh doctor "$n" | grep -q '^start(): would start$'; done
          if bash fleet.sh doctor foodbank-gw > seedless.log 2>&1; then echo "a gateway built without its seed"; exit 1; fi
          grep -q 'secrets/foodbank.example.seed' seedless.log
          mv "$RUNNER_TEMP/foodbank.example.seed" "$RUNNER_TEMP/kitchen.example.seed" secrets/
          # The file alone cannot carry the code attachments: the published doctor says so by refusing.
          if "$BIN" doctor nodes/kitchen-gw.toml > file-doctor.log; then echo "doctor over the file alone started"; exit 1; fi
          grep -q 'ae.authorised_at_seam: not_configured' file-doctor.log
          # The README's last lines: a wrong pin, and the kitchen's gateway refuses to talk to the partner at all.
          printf '%064d' 0 > exchange/foodbank-gw.pin && bash fleet.sh start-all
          if bash fleet.sh connect kitchen-gw | tee pin.log; then echo "connected under a wrong pin"; exit 1; fi
          grep -q 'presented an unpinned key' pin.log && grep -q '"sent":false' pin.log
          if bash fleet.sh call kitchen-gw pantry/stock | tee pin-call.log; then echo "called under a wrong pin"; exit 1; fi
          grep -q '"error":"link"' pin-call.log && grep -q '"sent":false' pin-call.log
          # The README's restore: the pin from the food bank gateway's certificate, and the call goes through again.
          bash fleet.sh stop kitchen-gw && "$BIN" tls pin certs/foodbank-gw/*.cert.pem > exchange/foodbank-gw.pin
          bash fleet.sh start kitchen-gw && bash fleet.sh connect kitchen-gw && bash fleet.sh call kitchen-gw pantry/stock | grep -q '^200 '
          # `tls issue` over a key already issued is refused, naming the pin it would invalidate.
          if "$BIN" tls issue --ca-dir ca/foodbank.example --node 127.0.0.1:7961 --out certs/foodbank-gw 2> reissue.err; then echo "re-issued silently"; exit 1; fi
          grep -q 'tls pin' reissue.err

  python-sdk:
    # The repo's first Python CI job: mycelium-py (call_typed) + the LangGraph
    # checkpointer, run as real integration tests against a two-node reason mesh
    # (the reason_node example) — node B resumes what node A checkpointed.
    name: Python SDK + LangGraph checkpointer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p mycelium-reason --features llm,gateway --example reason_node
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start reason nodes (A + B, meshed)
        run: |
          mkdir -p "$RUNNER_TEMP/blobs-a" "$RUNNER_TEMP/blobs-b"
          # RUST_LOG: the blob fetch's miss lines (debug) land in node-*.log, which a failure keeps (#563).
          export RUST_LOG=warn,mycelium_reason=debug
          BIND_PORT=7101 HTTP_PORT=8101 MODEL=fable-mini BLOB_DIR="$RUNNER_TEMP/blobs-a" \
            ./target/debug/examples/reason_node > "$RUNNER_TEMP/node-a.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/node-a.pid"
          BIND_PORT=7102 HTTP_PORT=8102 BOOTSTRAP=127.0.0.1:7101 MODEL=fable-mini BLOB_DIR="$RUNNER_TEMP/blobs-b" \
            ./target/debug/examples/reason_node > "$RUNNER_TEMP/node-b.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/node-b.pid"
          for port in 8101 8102; do
            for i in $(seq 1 60); do
              curl -sf "http://127.0.0.1:$port/health" > /dev/null && break
              if [ "$i" -eq 60 ]; then
                echo "node on port $port never became healthy"
                cat "$RUNNER_TEMP"/node-*.log
                exit 1
              fi
              sleep 1
            done
          done
          # `/health` proves the HTTP server is up. It does NOT prove the gateway can dispatch,
          # and these tests dispatch immediately. Under the default secure caller-context profile
          # (item 7) a gateway refuses to route to a provider whose `sys/caller-context/{node}`
          # marker it cannot see — HTTP 412 `provider_without_caller_context`, correctly, rather
          # than silently running the call as the node. That marker is published lazily (once a
          # peer connects, or after a 5 s grace — `lifecycle.rs`, so the write cannot land in a
          # reconnect-backoff window) and then has to gossip to the other node. Between "healthy"
          # and "both markers visible" every dispatch is a 412, which is what reddened
          # `TestCallTyped::*` on 2026-09-15.
          #
          # So gate on the thing the tests actually need. Same lesson as integration scenario 13:
          # a readiness poll must prove the capability about to be used, not a weaker one that
          # happens to be available (docs/wiki/dev/testing/testing.md).
          for i in $(seq 1 60); do
            seen=$(curl -sf "http://127.0.0.1:8101/gateway/kv/keys?prefix=sys/caller-context/" \
                   | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["keys"]))' 2>/dev/null || echo 0)
            [ "$seen" -ge 2 ] && break
            if [ "$i" -eq 60 ]; then
              echo "node A never saw both caller-context markers (saw $seen); gateway dispatch would 412"
              curl -s "http://127.0.0.1:8101/gateway/kv/keys?prefix=sys/caller-context/" || true
              cat "$RUNNER_TEMP"/node-*.log
              exit 1
            fi
            sleep 1
          done
      - run: pip install './mycelium-py[typed]' ./langgraph-checkpoint-mycelium ./strands-session-mycelium pytest pytest-asyncio langgraph httpx-sse
      # By directory, never by file (verification policy rule 3): a named list left five node-free test files
      # out of CI until 2026-10-06. The live gateway suite skips itself here (no MYCELIUM_TEST_HOST) and runs in
      # its own step below against a plain node.
      - run: pytest langgraph-checkpoint-mycelium/tests mycelium-py/tests strands-session-mycelium/tests -v
        env:
          MYCELIUM_TEST_PORT: 8101
          MYCELIUM_TEST_PORT_B: 8102
          # The reason-node suites (test_reason, test_typed, the checkpointer's) fail rather than skip if
          # the ports above go missing. The Strands session store's live suite needs a fleet that votes
          # (its claims are consensus writes; the reason nodes are built without `consensus`) and runs in
          # its own step below.
          MYCELIUM_REASON_LIVE_REQUIRED: "1"
      # The LangGraph example ladder, rungs 0–5 (echo variant): each runs against the
      # shared A/B mesh above and prints `RUNG N OK`. Rung 03 needs the second node
      # (MYCELIUM_TEST_PORT_B); the rest ignore it. Rung 06 has its own step below.
      - name: LangGraph ladder rungs 0–5 (echo)
        run: |
          for rung in 00_hello_skill 01_typed 02_durable_state 03_cross_node 04_routed 05_traces; do
            echo "@@case@@ examples/langgraph::$rung"
            echo "── $rung ──"
            MYCELIUM_TEST_PORT=8101 MYCELIUM_TEST_PORT_B=8102 python examples/langgraph/$rung.py || exit 1
          done
      # The rung-6 deploy/reheal flagship (echo variant): manages its OWN two-node mesh
      # (ports 73xx/83xx — disjoint from the shared A/B above) because it kills a node
      # mid-run. Proves a LangGraph graph's model dependency follows it across node death.
      - run: cargo build -p mycelium-reason --features llm,gateway --example reheal_node
      - run: |
          echo "@@case@@ examples/langgraph::06_deploy_reheal"
          python examples/langgraph/06_deploy_reheal.py
      # mycelium-py's live gateway suite (realignment repairs S4, the Python half). It was never in
      # the pytest list above, so it never ran in CI; against a `mycelium` node it passes (the
      # Python SDK reads every route the TypeScript one got wrong correctly). Its own node, because
      # the reason nodes above are built without the binary's default features.
      - run: cargo build --bin mycelium
      - name: mycelium-py live gateway suite
        run: |
          GOSSIP_HTTP_PORT=9312 ./target/debug/mycelium --port 9302 > "$RUNNER_TEMP/py-node.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/py-node.pid"
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9312/health > /dev/null && break
            if [ "$i" -eq 60 ]; then echo "node never became healthy"; cat "$RUNNER_TEMP/py-node.log"; exit 1; fi
            sleep 1
          done
          for i in $(seq 1 60); do
            seen=$(curl -sf "http://127.0.0.1:9312/gateway/kv/keys?prefix=sys/caller-context/" \
                   | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["keys"]))' 2>/dev/null || echo 0)
            [ "$seen" -ge 1 ] && break
            if [ "$i" -eq 60 ]; then echo "the node never published its caller-context marker"; cat "$RUNNER_TEMP/py-node.log"; exit 1; fi
            sleep 1
          done
          # The live directory, not a file: a new live suite runs the day it lands. MYCELIUM_LIVE_REQUIRED
          # makes a missing node a failure rather than an all-skipped green run.
          MYCELIUM_LIVE_REQUIRED=1 MYCELIUM_TEST_HOST=127.0.0.1 MYCELIUM_TEST_PORT=9312 pytest mycelium-py/tests/live -v
      # The Strands session store (post-360 row O) against three meshed `mycelium` nodes, which vote: the
      # store claims each record and message index by a consensus write, so its live suite needs a quorum.
      # Its directory, with MYCELIUM_STRANDS_LIVE_REQUIRED, so a step that lost its fleet fails, not skips.
      - name: Strands session store against a voting fleet
        run: |
          for n in 1 2 3; do
            peers=""; [ "$n" -gt 1 ] && peers="--peers 127.0.0.1:9331"
            GOSSIP_HTTP_PORT=934$n ./target/debug/mycelium --port 933$n $peers > "$RUNNER_TEMP/strands-node-$n.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/strands-node-$n.pid"
          done
          # Every node's caller-context marker, seen from the first: the mesh is formed and dispatch will not 412.
          for i in $(seq 1 60); do
            seen=$(curl -sf "http://127.0.0.1:9341/gateway/kv/keys?prefix=sys/caller-context/" \
                   | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["keys"]))' 2>/dev/null || echo 0)
            [ "$seen" -ge 3 ] && break
            if [ "$i" -eq 60 ]; then echo "the strands fleet never formed (saw $seen)"; cat "$RUNNER_TEMP"/strands-node-*.log; exit 1; fi
            sleep 1
          done
          MYCELIUM_STRANDS_LIVE_REQUIRED=1 MYCELIUM_STRANDS_PORTS=9341,9342,9343 pytest strands-session-mycelium/tests -v
      - name: Stop reason nodes
        if: always()
        run: |
          for n in a b; do
            [ -f "$RUNNER_TEMP/node-$n.pid" ] && kill "$(cat "$RUNNER_TEMP/node-$n.pid")" 2>/dev/null || true
          done
          [ -f "$RUNNER_TEMP/py-node.pid" ] && kill "$(cat "$RUNNER_TEMP/py-node.pid")" 2>/dev/null || true
          for n in 1 2 3; do
            [ -f "$RUNNER_TEMP/strands-node-$n.pid" ] && kill "$(cat "$RUNNER_TEMP/strands-node-$n.pid")" 2>/dev/null || true
          done
      # The nodes' own logs, kept when the job fails: #561/#563 could not be diagnosed without them (a blob fetch
      # miss now logs which providers it asked and what each answered).
      - name: Keep the nodes' logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-job-node-logs
          path: |
            ${{ runner.temp }}/node-*.log
            ${{ runner.temp }}/py-node.log
            ${{ runner.temp }}/strands-node-*.log
          if-no-files-found: ignore

  conway-gpu:
    # Standalone GPU demo (examples/conway-gpu): excluded from the workspace so its
    # wgpu stack is NOT a mycelium dev-dependency (it used to drag the whole GPU
    # toolchain into every `cargo test` / `clippy --tests`). Compile-check it here in
    # its own parallel, cached job so the demo doesn't bit-rot — off the hot path.
    name: Conway GPU demo (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --manifest-path examples/conway-gpu/Cargo.toml

  demo-smoke:
    name: Demo smoke (community cluster + mock LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --bin skillrunner --features a2a
      # Scripted run of the community demo against a deterministic mock LLM.
      # Promoted to CI after a live run-through (2026-06-11) found four
      # substrate bugs that unit tests and Docker scenarios never touched:
      # gateway router clobber, A2A tasks/send timeout, tool results sent as
      # non-string content, skillrunner surviving SIGTERM. Each smoke
      # assertion is a regression gate for one of them.
      - run: ./examples/community/ci_smoke.sh

  audit:
    name: Dependency audit (RUSTSEC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      # Fails on vulnerabilities; unmaintained/unsound advisories surface as
      # warnings (tracked: bincode RUSTSEC-2025-0141 — wire-codec succession
      # is a ROADMAP v2 item).
      # Every tracked lockfile, by discovery — not the root one only. Until 2026-10-16 this ran
      # `cargo audit` on `Cargo.lock` alone, and `examples/conway-gpu/Cargo.lock` sat on five
      # advisories (rustls, h2) that no job could see (#625's review, finding 3).
      # Fails closed when it finds nothing to audit, or when the root lockfile is not among what it found
      # (#626's review: an empty list exited 0 having audited nothing).
      - run: |
          status=0; audited=0; root=0
          while IFS= read -r -d '' lock; do
            echo "::group::cargo audit -f $lock"
            audited=$((audited + 1)); [ "$lock" = "Cargo.lock" ] && root=1
            cargo audit -f "$lock" || { status=1; echo "::error file=$lock::cargo audit failed for $lock (an advisory, or the audit could not run)"; }
            echo "::endgroup::"
          done < <(git ls-files -z '*Cargo.lock')
          if [ "$root" -ne 1 ]; then echo "::error::the root Cargo.lock was not audited ($audited lockfile(s) found)"; exit 1; fi
          echo "audited $audited lockfile(s)"
          exit $status

  afn-smoke:
    name: AFN fluid-pipeline smoke (pull + push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --example three_node_demo
      # Both distribution modes of the AFN demo end-to-end as local processes:
      # pull (tuple-space take/complete — the canonical pattern) and push
      # (coordinator-dispatch baseline kept for comparison). Asserts 24/24
      # completion in each; fresh nodes per mode.
      - run: ./examples/fluid_pipeline/ci_smoke.sh both

  coop-smoke:
    name: Food-Rescue Co-op example suite (13 demos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      # Pre-build the crate WITH `wasm` (provisioning + catalog pull wasmtime — a long first compile
      # cached by rust-cache) so the smoke's per-demo `cargo run`s are warm and the run-phase timing
      # isn't dominated by the build. `wasm` is opt-in (examples/coop/Cargo.toml) so the other ten
      # demos build without wasmtime locally; here we warm everything.
      - run: cargo build -p mycelium-coop-examples --features wasm
      # The crate's `metrics` feature (forwarded to `mycelium/metrics` for the Ops Console tab) was built by no step on
      # its own until post-360 row J; a check, without `wasm`, so it adds no wasmtime build.
      - run: cargo check -p mycelium-coop-examples --features metrics --bins
      # Every demo `ci_smoke.sh` runs (thirteen, 2026-10-07), end-to-end as local in-process clusters: mailbox↔LLM,
      # stigmergy, elastic-intent, the WASM autonomic flagship (+ failover),
      # cross-domain AgentFacts, identity rotation, cross-group consensus,
      # LLM-over-tuple-space coordination, and on-demand MCP tool-growth. Each
      # demo asserts its own invariants; the script fails on the first miss.
      - run: ./examples/coop/ci_smoke.sh

  sdk-ts:
    name: TypeScript SDK type check + live suite
    runs-on: ubuntu-latest
    # The TS SDK shipped 8 tsc errors — including a runtime-breaking
    # `this._base` typo in shardFor() — because nothing in CI ever ran the
    # compiler over it (M2 Run-21). `tsc --noEmit` is the type gate; since
    # 2026-09-05 `jest` runs too — the live-node suite skips itself without
    # MYCELIUM_TEST_HOST, the node-free suites (auth.test.ts) do not.
    defaults:
      run:
        working-directory: mycelium-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mycelium-ts/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # --verbose: each test's ✓/○ line, which the test-coverage job reads; --json: every test's title,
      # skipped ones included (a fully skipped suite prints no ✓/○ lines), for the universe below.
      - run: npx jest --verbose --json --outputFile="$RUNNER_TEMP/jest-results.json"
      # The TypeScript half of the test universe: every test file jest would collect, and every test's title
      # (skipped ones too), listed — the test-coverage job checks each executed somewhere.
      - name: List the TypeScript test universe
        run: |
          echo "@@test-universe@@ begin typescript"
          npx jest --listTests
          python3 ../scripts/ci-jest-universe.py "$RUNNER_TEMP/jest-results.json"
          echo "@@test-universe@@ end"
      # The live suite against a real node (realignment repairs S4). It skips itself without
      # MYCELIUM_TEST_HOST, which nothing here set until 2026-10-05 — so it never ran in CI, and
      # run by hand it failed 9 of its 19 assertions against the gateway it was written for.
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --bin mycelium
        working-directory: .
      - name: Start a node for the live suite
        working-directory: .
        run: |
          GOSSIP_HTTP_PORT=9311 ./target/debug/mycelium --port 9301 > "$RUNNER_TEMP/ts-node.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ts-node.pid"
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9311/health > /dev/null && break
            if [ "$i" -eq 60 ]; then echo "node never became healthy"; cat "$RUNNER_TEMP/ts-node.log"; exit 1; fi
            sleep 1
          done
          # Gate on the capability the tests use, not on /health: dispatch to this node needs its own
          # caller-context marker to be visible (the python-sdk job's 2026-09-15 lesson).
          for i in $(seq 1 60); do
            seen=$(curl -sf "http://127.0.0.1:9311/gateway/kv/keys?prefix=sys/caller-context/" \
                   | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["keys"]))' 2>/dev/null || echo 0)
            [ "$seen" -ge 1 ] && break
            if [ "$i" -eq 60 ]; then echo "the node never published its caller-context marker"; cat "$RUNNER_TEMP/ts-node.log"; exit 1; fi
            sleep 1
          done
      - name: Live suite
        # The live directory, not a file (verification policy rule 3); MYCELIUM_LIVE_REQUIRED fails the
        # step if the node variable is missing rather than letting every live test skip green.
        run: npx jest --verbose tests/live
        env:
          MYCELIUM_LIVE_REQUIRED: "1"
          MYCELIUM_TEST_HOST: 127.0.0.1
          MYCELIUM_TEST_PORT: 9311
      - name: Stop the node
        if: always()
        working-directory: .
        run: '[ -f "$RUNNER_TEMP/ts-node.pid" ] && kill "$(cat "$RUNNER_TEMP/ts-node.pid")" 2>/dev/null || true'

  fuzz:
    name: Fuzz (wire + capability decoders, time-boxed)
    runs-on: ubuntu-latest
    # Dedicated cargo-fuzz job: the in-suite mini-fuzz (test job above) covers
    # adversarial decode on every push, but the libFuzzer targets explore far
    # deeper. Run 20's decode-DoS sat uncaught while these targets existed
    # without a CI job. Skipped on PRs to keep review latency low; runs on
    # main pushes and the weekly schedule.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # Explicit `tool:` form — the @cargo-fuzz tag shorthand resolved to no
      # tool at all on first run ("no such command: fuzz", exit 101).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # `+nightly` is required even though the toolchain action installs
      # nightly: the repo's rust-toolchain.toml pins stable, which otherwise
      # wins toolchain resolution and -Zsanitizer=address fails to parse.
      # Explicit gnu target: the prebuilt cargo-fuzz binary is musl-static
      # and defaults to its own build triple, but ASan is incompatible with
      # statically linked libc ("can't find crate for core" on musl).
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu wire_decode -- -max_total_time=120
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu capability_decode -- -max_total_time=120
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu frame_apply -- -max_total_time=120
      # Trust-edge parsers (§12.6): every parser the v3 axis added that reads partner- or
      # client-controlled bytes before they have been verified. Each asserts the invariant
      # it is relied on for, so a wrong-but-well-formed parse fails the run, not just a crash.
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu caller_frame -- -max_total_time=120
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu presented_call -- -max_total_time=120
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu catalog_reply -- -max_total_time=120
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu federation_objects -- -max_total_time=120
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu trust_bundle -- -max_total_time=120
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu replay_trace -- -max_total_time=120
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu closure_corpus -- -max_total_time=120
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu caller_envelope -- -max_total_time=120
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu replay_bundle -- -max_total_time=120
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu fixint_decode -- -max_total_time=120

  loom:
    # Permutation model-checking of the lock-free/atomic patterns (the
    # calibration ledger's recurring "act on a stale read" bug family). `loom-spike`
    # is a deliberately tokio-free sibling crate: `--cfg loom` is global to a build
    # and tokio gates net/fs behind `#![cfg(not(loom))]`, so any tokio-linked crate
    # fails to compile under it. The suite compiles to an EMPTY crate without the cfg;
    # only `--cfg loom` (via RUSTFLAGS) pulls loom in and runs the models. This runs
    # the CORRECT tests only — the `#[ignore]`d broken twins (executable proof loom
    # catches the race) stay out of the default run, so CI is green.
    name: Loom (concurrency model-check)
    runs-on: ubuntu-latest
    env:
      # Bound the exploration (loom is exponential in preemptions). The models
      # are tiny (2–3 threads, 1–2 atomics); this is belt-and-braces headroom.
      LOOM_MAX_PREEMPTIONS: 3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: RUSTFLAGS="--cfg loom" cargo test -p loom-spike --release

  test-universe:
    # Verification policy rule 3, the universe half: every test the compiler and the runners know of,
    # including ones gated on a feature no other step enables. `cargo test --all-features -- --list`
    # builds every crate's every test target with all its features and lists without running; the
    # no-default-features build lists what `not(feature = …)` gates hide from it. The marker lines bracket
    # what the test-coverage job reads as listed rather than executed.
    name: Test universe (listed, not run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install './mycelium-py[typed]' ./langgraph-checkpoint-mycelium ./strands-session-mycelium pytest pytest-asyncio langgraph httpx-sse
      - name: List every test
        run: |
          echo "@@test-universe@@ begin rust-python"
          cargo test --workspace --all-features --no-fail-fast -- --list
          # Every workspace crate's own featureless build, so a test gated `not(feature = …)` in any crate is
          # known (derived from cargo metadata, so a new crate is covered the day it joins the workspace). A
          # guard: on 2026-10-07 it added no test the lines above missed, and costs about six minutes.
          for p in $(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; [print(p["name"]) for p in json.load(sys.stdin)["packages"]]'); do
            cargo test -p "$p" --no-default-features --no-fail-fast -- --list || exit 1
          done
          pytest --collect-only -q langgraph-checkpoint-mycelium/tests mycelium-py/tests strands-session-mycelium/tests tests/a2a-sdk
          echo "@@test-universe@@ end"
      # The script-style suites this workflow runs, case by case: each suite's --list prints one
      # `@@case-list@@ <suite>::<case>` line per case without running anything, and each case prints
      # `@@case@@ <suite>::<case>` as it starts, in whichever job runs it. The LangGraph ladder's rungs are
      # listed from the directory, so a new rung no step runs is a case that never executed. Each single
      # `cargo run … --example` demonstration above runs through scripts/example-case.sh, whose --list reads
      # those calls from this file. The Docker suites list and check theirs in cluster-suites.yml, a workflow
      # this run does not include.
      - name: List the script suites' cases
        run: |
          echo "@@test-universe@@ begin scripts"
          python3 scripts/test-check-materials.py --list
          python3 scripts/test-check-front-doors.py --list
          python3 scripts/test-check-feature-pages.py --list
          python3 scripts/test-ci-test-coverage.py --list
          ./scripts/with-pyyaml.sh scripts/test-check-test-inventory.py --list
          bash scripts/test-ci-retest.sh --list
          bash scripts/wire-check-examples.sh --list
          bash scripts/example-case.sh --list
          bash scripts/ops-console-render.sh --list
          ./scripts/with-pyyaml.sh scripts/test-check-example-matrix.py --list
          bash mycelium-blackboard/ci_smoke.sh --list
          bash mycelium-wiki/ci_smoke.sh --list
          bash mycelium-reason/ci_smoke.sh --list
          bash mycelium-guardrails/ci_smoke.sh --list
          bash examples/community/ci_smoke.sh --list
          bash examples/fluid_pipeline/ci_smoke.sh --list
          bash examples/coop/ci_smoke.sh --list
          for f in examples/langgraph/[0-9][0-9]_*.py; do echo "@@case-list@@ examples/langgraph::$(basename "$f" .py)"; done
          echo "@@test-universe@@ end"

  a2a-sdk:
    # Post-360 plan row N: an unmodified A2A client — `a2a-sdk` 1.2.2, the library Strands Agents uses — reaches a
    # node's skills through `/a2a`. The 2026-10-12 probe (docs/plans/external/2026-10-12-a2a-sdk-probe/) found it
    # could not; this is that probe as a test. The SDK's card resolver, client factory and both its JSON-RPC
    # transports (1.0, and 0.3's compatibility one) against `examples/a2a_sdk_node.rs`. The version is pinned so a
    # new SDK is a deliberate change here, not a red run.
    name: A2A SDK (a2a-sdk against a node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --example a2a_sdk_node --features a2a,compliance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'a2a-sdk[http-server]==1.2.2' httpx pytest
      - name: a2a-sdk against a node
        run: |
          PORT=7311 A2A_TOKEN=a2a-sdk-test ./target/debug/examples/a2a_sdk_node > "$RUNNER_TEMP/a2a-node.log" 2>&1 &
          # `ready` is printed once a send dispatches: the skill advertised and the caller-context marker written.
          for i in $(seq 1 90); do
            grep -q '^ready' "$RUNNER_TEMP/a2a-node.log" && break
            if [ "$i" -eq 90 ]; then echo "the node never became ready"; cat "$RUNNER_TEMP/a2a-node.log"; exit 1; fi
            sleep 1
          done
          # The directory, not a file. MYCELIUM_A2A_LIVE_REQUIRED makes a missing node a failure, not a skipped run.
          MYCELIUM_A2A_LIVE_REQUIRED=1 MYCELIUM_A2A_URL=http://127.0.0.1:7312 MYCELIUM_A2A_TOKEN=a2a-sdk-test \
            pytest tests/a2a-sdk -v

  ops-console:
    # Adopter-surface Y3 (D16, D28): the Ops Console is a static page that reads each node's existing routes from the
    # browser. Chrome (on the runner image) renders it against a three-node fleet, every tab, and the DOM is checked
    # against the README's table: each node `ok`, from exactly the routes the row names. Then the same page from an
    # origin no node lists (every node `blocked` — the browser withholds the answers) and without the bearer (every
    # node `unauthorized`). The gateway's own CORS refusals are the lib tests' `cors_tests`.
    name: Ops Console (a static page, rendered against a fleet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --example observed_fleet --features metrics,compliance
      - run: bash scripts/ops-console-render.sh

  strands-fleet:
    # Post-360 plan row P: Strands agents on three nodes plan one shared task, keep their session and swarm memory in
    # the fleet (row O) and call fleet skills through `/a2a` (row N); a call outside an agent's mandate is refused and
    # read back from the evidence journal; the hub is stopped and the courier resumes on the depot from its stored
    # session. The driver starts the authority and the nodes itself and checks each act from the fleet's records.
    name: Strands fleet (three nodes, one plan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --example strands_fleet_node --features tls,a2a,compliance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ./mycelium-py ./strands-session-mycelium cryptography httpx
      - run: python examples/strands_fleet/run_demo.py

  test-coverage:
    # Verification policy rule 3, observed: fails unless every test in the universe EXECUTED (passed or
    # failed — not skipped, ignored, filtered out, or in a step that did not run) in some job of this run.
    # It reads the jobs' own logs, so it needs every job that runs tests; a job it does not wait for and
    # finds unfinished fails it (add the job to `needs`). Exceptions, each with a reason:
    # scripts/test-coverage-exceptions.txt. The static scripts/check-test-inventory.py is the fast
    # pre-push approximation of this.
    name: Test coverage (observed)
    runs-on: ubuntu-latest
    if: always()
    needs: [test, embedded, wasm-host, wasm-host-macos, agentfacts, blackboard, effects, commitment, wiki, reason, scaffold,
            guardrails, python-sdk, sdk-ts, loom, demo-smoke, afn-smoke, coop-smoke, conway-gpu, documentation, clippy,
            audit, test-universe, a2a-sdk, strands-fleet, ops-console]
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ci-test-coverage.py --fetch "$RUNNER_TEMP/job-logs"
        env:
          GH_TOKEN: ${{ github.token }}
      # The feature pages' half of rule 3 (docs/plans/feature-pages.md P1, P2): every test a feature page names
      # as running the feature executed in this run, read from the logs the step above fetched. Runs when that
      # step fails too, so a missing test is reported beside the coverage finding.
      - if: success() || failure()
        run: python3 scripts/check-feature-pages.py --executed "$RUNNER_TEMP/job-logs"

