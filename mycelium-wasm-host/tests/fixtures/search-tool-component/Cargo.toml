# WASM guest fixture: the llm_agent demo's `search` tool as a capability component (zero-gaps Z4) —
# the handler that was in-process code in `examples/llm_agent.rs`, now pulled over the mesh and
# provisioned at runtime by a stem, bridged as the MCP tool `search`. Answers `describe` with its
# own input schema (D4). Built out-of-band for wasm32-wasip2 (produces a component); the resulting .wasm
# is committed as a fixture so CI needs no wasm toolchain. Regenerate with build.sh.
# Standalone (not part of the parent workspace — it's a wasm32 cdylib).
[workspace]

[package]
name = "search-tool-component"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
