[package]
name = "mycelium-wasm-host"
version = "2.18.2"
edition = "2024"
rust-version = "1.94"
authors = ["Dr. Richard Nicholson <tathatasystems@proton.me>"]
description = "WASM Component host for Mycelium (v2.0 WS-E M12): pull + instantiate sandboxed capability components that talk to the local node through a capability-scoped WIT world — the runtime code-mobility / OSGi-bundle analogue, built on Mycelium's public API"
license = "AGPL-3.0-only"
repository = "https://github.com/RichardTathata/mycelium"
keywords = ["wasm", "component-model", "code-mobility", "distributed-systems", "wasmtime"]
categories = ["wasm", "network-programming"]

[dependencies]
# Companion-crate contract: only Mycelium's PUBLIC API is used (the composability
# proof, same as mycelium-tuple-space). wasmtime is confined to THIS crate — it must
# never leak into mycelium / mycelium-core (preserves core's small dep tree; WS-A).
mycelium = { path = "..", default-features = false }

# WASM Component Model runtime. component-model is the WIT/canonical-ABI half.
wasmtime = "49"
# WASI host implementation. Real components (std-based guests) import wasi:* from libc
# init; the host provides a *restricted, deny-by-default* WASI context (no fs/net/env/stdio)
# as part of the sandbox — a component's only doors are our scoped imports + minimal WASI.
wasmtime-wasi = "49"

anyhow   = "1"
# The ArtifactRuntime kind-dispatch trait (docs/design/artifact-library.md §4) is async —
# installs run as long-lived background tasks (large blob pulls must not block a tick).
async-trait = "0.1"
bytes    = "1"
tracing  = "0.1"
sha2     = "0.10"
fastrand = "2"
# Optional signed-provenance over the content address (a publisher vouches for the bytes).
ed25519-dalek = "2"
# `rt` only — the provisioner spawns a serve task per hosted capability (tokio::spawn +
# JoinHandle). The embedder supplies the runtime (same one the GossipAgent runs on).
tokio    = { version = "1.35", features = ["rt", "fs", "io-util"] }  # fs + io-util: the disk stage (S1)
# Resource-aware install eligibility (artifact-library §4.4): the default ResourceProbe
# reads available memory + disk so a node never elects for an artifact it cannot fit.
# system+disk features only — no process/network/component scanning.
sysinfo = { version = "0.38.4", default-features = false, features = ["system", "disk"] }
# The HTTP object-store source (artifact-library §2.2 step 6): GET-by-content-address from
# any HTTP(S) blob store (S3-compatible, nginx, CDN). rustls — no system openssl.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Operator-visible tripwires (Run-38 floor fix): the provisioner/librarian emit counters
# through the `metrics` facade — a no-op without a recorder, and they flow into the node's
# /metrics automatically when the embedder enables mycelium's `metrics` feature. Unconditional
# (unlike core's feature gate) by choice: this crate already carries wasmtime, and the facade
# is tiny.
metrics = "0.24"

# The stem node binary (design-time-tooling.md §13, R1/R2): a node that declares from its unit
# file and provisions what the declarations call for. Opt-in so the library carries no logging
# subscriber.
tracing-subscriber = { version = "0.3", optional = true }
object_store = { version = "0.14", features = ["aws", "gcp"], optional = true }
# A3: the gateway publish route (`POST /gateway/artifacts/publish`), merged into the node's
# gateway via `with_http_routes` — the same seam every companion uses.
axum       = { version = "0.8", optional = true }
serde      = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[features]
stem = ["dep:tracing-subscriber"]
object_store = ["dep:object_store"]
gateway = ["mycelium/gateway", "dep:axum", "dep:serde", "dep:serde_json"]
# X2: `[[serve]]` — a stem bridges a live local install into a routable prompt skill (core's llm).
llm = ["mycelium/llm"]

[[bin]]
name              = "mycelium-stem"
path              = "src/bin/mycelium-stem.rs"
required-features = ["stem"]

# The artifact tool (design-time-tooling.md §10, A1): publish | list | verify over a library.
[[bin]]
name              = "mycelium-artifact"
path              = "src/bin/mycelium-artifact.rs"
required-features = ["stem"]

[dev-dependencies]
# test-only: the bind-verified, process-unique port allocator (retires the free_port TOCTOU
# flake class). Cargo unions this with the normal `mycelium` dep for the test target only.
# `compliance` so the gateway gate can see the scope layer refuse a wrong family (RBAC is a
# compliance feature of the node; without it a bearer is a bearer).
mycelium = { path = "..", default-features = false, features = ["test-util", "compliance"] }
metrics-util = "0.20.4"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
