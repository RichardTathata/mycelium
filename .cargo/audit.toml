# cargo-audit's configuration. `cargo audit` reads `.cargo/audit.toml` under the directory it runs in; CI's `audit` job
# runs from the repository root, `cargo audit -f <lockfile>` for every tracked lockfile, so this one file governs all
# three. R9 of `docs/plans/external-review-2026-10-31.md`: every warning CI passes is named here with a date and a
# reason, so none is accepted silently. No vulnerability is ignored here; a vulnerability fails the job.
#
# Review an entry when its reason stops holding (the dependency gains a release, or the path below changes). The date is
# when the entry was written.

[advisories]
ignore = [
    # 2026-11-06 — `paste` 1.0.15 is unmaintained (no advisory of a defect). It is only in
    # `examples/conway-gpu/Cargo.lock`, the excluded GPU demo crate, through `metal` (wgpu's Metal backend): a procedural
    # macro run at build time, in no shipped build and in no other lockfile. Remove when wgpu's stack drops it.
    "RUSTSEC-2024-0436",
]
