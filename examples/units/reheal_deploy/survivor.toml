# survivor: the survivor: started late, idle while the origin holds the floor, and the host the model reheals onto when the origin dies. Each host has its own Ollama
# (OLLAMA_HOST in its container), so the survivor's model is a fresh creation from the bytes it pulled.
principal = "survivor"

[[requirement]]
ns   = "artifact"
name = "librarian"

[hosts]
kinds                = ["blob"]
install_budget_bytes = 8589934592
headroom             = 0.8
# The suite's test publisher: the public half of seed 42…42 (`make stem-keys`). A fixture, not a secret.
trusted_publishers   = ["ed25519:2152f8d19b791d24453242e15f2eab6cb7cffa7b6a5ed30097960e069881db12"]
placement_root       = "/var/lib/mycelium/artifacts"

# Keep exactly one deployment alive fleet-wide: when the origin dies, the floor is unmet and the
# survivor installs — the reheal is this invariant, not an orchestrator.
[[presence]]
ns            = "llm"
name          = "storyteller-deploy"
min_providers = 1

[[presence]]
ns            = "llm"
name          = "storyteller-weights"
min_providers = 1

[[activation]]
ns   = "llm"
name = "storyteller-deploy"
resolve_artifact_refs = true
command      = ["sh", "/repo/examples/units/model_deploy/ollama-activate.sh", "{rendered}", "coop-storyteller"]
probe        = ["sh", "/repo/examples/units/model_deploy/ollama-probe.sh", "coop-storyteller"]
timeout_secs = 300

# While the deployment is live here, serve the routable skill `llm/storyteller` from this host's Ollama.
[[serve]]
name       = "storyteller"
endpoint   = "http://172.40.0.56:11434/v1"
model      = "coop-storyteller"
max_tokens = 48
[serve.while_live]
ns   = "llm"
name = "storyteller-deploy"
