# The storyteller's deployment profile: a governed artifact, signed like the weights, naming them by
# content address (`FROM artifact:<hex>`). Written at run time (`prepare.sh`) once the weights' hash
# is known; activation renders the reference to the placed path and creates the model.
kind             = "blob"
bytes            = "storyteller.Modelfile"
est_install_secs = 1

[provides]
ns   = "llm"
name = "storyteller"

[requires]
disk_bytes = 4096
mem_bytes  = 0
