# model-host: hosts the storyteller's component and its weights (blob), and keeps one of each alive.
principal = "model-host"

# Pulls bytes from whichever node advertises the librarian (MeshArtifactSource resolves it).
[[requirement]]
ns   = "artifact"
name = "librarian"

[hosts]
kinds                = ["wasm-component", "blob"]
install_budget_bytes = 8589934592
headroom             = 0.8
# The suite's test publisher: the public half of seed 42…42 (`make stem-keys`). A fixture, not a secret.
trusted_publishers   = ["ed25519:2152f8d19b791d24453242e15f2eab6cb7cffa7b6a5ed30097960e069881db12"]
placement_root       = "/var/lib/mycelium/artifacts"

[[presence]]
ns            = "llm"
name          = "storyteller"
min_providers = 1

[[presence]]
ns            = "llm"
name          = "storyteller-weights"
min_providers = 1

