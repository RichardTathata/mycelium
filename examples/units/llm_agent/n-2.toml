# n-2: the inference node. In the code demo `llm/inference` is probed against a local Ollama and
# model pulls are simulated; as a stem it deploys a real model (weights + governed profile) into its
# Ollama and serves the routable skill `llm/inference` while that deployment is live (D21, D22).
principal = "n-2"

[[requirement]]
ns   = "artifact"
name = "librarian"

[hosts]
kinds                = ["blob"]
install_budget_bytes = 8589934592
headroom             = 0.8
# The suite's test publisher: the public half of seed 42…42 (`make stem-keys`). A fixture, not a secret.
trusted_publishers   = ["ed25519:2152f8d19b791d24453242e15f2eab6cb7cffa7b6a5ed30097960e069881db12"]
placement_root       = "/var/lib/mycelium/artifacts"

[[presence]]
ns            = "llm"
name          = "inference-deploy"
min_providers = 1

[[presence]]
ns            = "llm"
name          = "storyteller-weights"
min_providers = 1

[[activation]]
ns   = "llm"
name = "inference-deploy"
resolve_artifact_refs = true
command      = ["sh", "/repo/examples/units/model_deploy/ollama-activate.sh", "{rendered}", "coop-storyteller"]
probe        = ["sh", "/repo/examples/units/model_deploy/ollama-probe.sh", "coop-storyteller"]
timeout_secs = 300

[[serve]]
name       = "inference"
endpoint   = "http://172.40.0.65:11434/v1"
model      = "coop-storyteller"
max_tokens = 48
[serve.while_live]
ns   = "llm"
name = "inference-deploy"
