# n-2: the inference node — a probed llm/inference plus the models it could install (examples/node_n2.toml).
principal = "n-2"

[[capability]]
ns                 = "llm"
name               = "inference"
probe_url          = "http://localhost:11434/api/tags"
probe_timeout_secs = 3
ttl_secs           = 30
  [capability.attrs]
  model    = "llama3.2"
  context  = 8192
  backend  = "ollama"
  endpoint = "http://localhost:11434/v1"

[[capability]]
ns       = "llm"
name     = "installable"
ttl_secs = 300
  [capability.attrs]
  model = "llama3.2:1b"
  size_gb = 1.3
  est_mins = 1

