# The agent: needs realtime data, an inference skill, a CPU tool node, the vector-search dataset —
# installed on demand — and its four MCP tools, which are components the tool nodes host and the
# runtime bridges (zero-gaps Z4; `artifacts/tool-*.toml`). The browser demo keeps them in-process.
principal = "app"

[[requirement]]
ns   = "data"
name = "realtime"

[[requirement]]
ns   = "llm"
name = "inference"

[[requirement]]
ns   = "compute"
name = "cpu"

[[requirement]]
ns   = "data"
name = "vector-search"

[[requirement]]
ns   = "tool"
name = "weather"

[[requirement]]
ns   = "tool"
name = "ping"

[[requirement]]
ns   = "tool"
name = "search"

[[requirement]]
ns   = "tool"
name = "calculate"
