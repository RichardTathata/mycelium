# The agent: needs realtime data, an inference skill, a CPU tool node, and the vector-search dataset
# — the last one installed on demand. (Its MCP tools — weather, ping, search, calculate — are
# in-process code in the demo and have no row in the unit format.)
principal = "app"

[[requirement]]
ns   = "data"
name = "realtime"

[[requirement]]
ns   = "llm"
name = "inference"

[[requirement]]
ns   = "compute"
name = "cpu"

[[requirement]]
ns   = "data"
name = "vector-search"
