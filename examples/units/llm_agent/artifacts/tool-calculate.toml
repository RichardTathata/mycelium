# The llm_agent demo's `calculate` tool as a capability component (zero-gaps Z4): what was in-process
# code in `examples/llm_agent.rs` is now an installable the hosting node pulls, verifies and runs,
# and the stem's runtime bridges it as the MCP tool `calculate` — with the schema the component
# describes for itself.
kind             = "wasm-component"
bytes            = "../../../../mycelium-wasm-host/tests/fixtures/calculate_tool_component.wasm"
est_install_secs = 1

[provides]
ns   = "tool"
name = "calculate"

[requires]
disk_bytes = 0
mem_bytes  = 67108864
