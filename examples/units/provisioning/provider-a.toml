# provider-a: hosts what the fleet needs installed (a provisioner runs here; the other is the standby).
principal = "provider-a"

[hosts]
kinds                = ["wasm-component"]
install_budget_bytes = 1073741824
headroom             = 0.8
trusted_publishers   = ["ed25519:coop-ci"]
placement_root       = "/var/lib/mycelium/artifacts"

