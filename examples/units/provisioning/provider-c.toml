trusted_publishers   = ["ed25519:2152f8d19b791d24453242e15f2eab6cb7cffa7b6a5ed30097960e069881db12", "ed25519:22fc297792f0b6ffc0bfcfdb7edb0c0aa14e025a365ec0e342e86e3829cb74b6"]
# The reviewer (44…44): only its acceptance promotes a proposal out of the shadow lane.
trusted_reviewers    = ["ed25519:d759793bbc13a2819a827c76adb6fba8a49aee007f49f2d0992d99b825ad2c48"]
placement_root       = "/var/lib/mycelium/artifacts"
