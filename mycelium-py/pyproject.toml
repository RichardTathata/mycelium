[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "mycelium-py"
version     = "0.2.16"
description = "Python SDK for the Mycelium gossip mesh — HTTP gateway client"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "httpx-sse>=0.4",
]

[project.optional-dependencies]
dev   = ["pytest>=9.0.3", "pytest-asyncio>=1.3.0"]
typed = ["pydantic>=2.4"]                # 2.4.0 fixes GHSA-mr82-8j83-vxmv
# Client signatures (identity-and-lifecycle I1): Ed25519 over the call.
# A security floor (0.2.16): 50.0.0 fixes GHSA-g6cj-pr64-35w5, 49.0.0 GHSA-jwv3-5hgf-82ww and GHSA-m2h6-j472-rp4c,
# and every earlier advisory against the old floor.
sign  = ["cryptography>=50.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mycelium"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
