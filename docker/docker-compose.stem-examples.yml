# The stem-examples suite (design-time-tooling.md §16, X2): a co-op demo run **both ways** — as the
# in-process code binary (the coop smoke) and as stem nodes from one image fed the demo's
# declaration directory (`examples/units/<demo>/`), reaching the same asserted outcome.
#
#   make test-stem-examples                # every recut demo
#   make examples-both-ways DEMO=provisioning
#
# Profiles: one per demo. Each has an `init` that publishes the demo's artifact descriptions into
# the shared library volume with the suite's test key (seed 42…42 — a fixture, not a secret; the
# public half is in every hosting unit's `trusted_publishers`), a driver (the roles §16 keeps as
# code: the buffer, the seeder, the worker, and the asserts) that is also the fleet's bootstrap
# seed, and the stems. Static IPs: a node id is `ip:port`. No TLS: one private network.
#
# What each profile recuts, and what it does not:
#   provisioning — providers a and b are stems over the shared library (`--library /lib`), and a
#                  librarian stem publishes the manifest into the gossiped catalogue (a library
#                  on disk is not a catalogue — the first CI run found that). The driver seeds,
#                  drains, kills the active provider through the docker socket, drains again
#                  ("self-healed"); then wave 3 (D20): it starts provider-c, stores a v2 component
#                  in the library and publishes it as an agent's *proposal*; the stems load it only
#                  into the shadow lane while the incumbent serves; a stranger's acceptance changes
#                  nothing; the reviewer's promotes it; the operator retires v1 from the manifest;
#                  the incumbents die, and provider-c serves the accepted v2 — visible in its
#                  replies ("shadow-then-accept complete"). Keys: operator 42…42, agent 43…43,
#                  reviewer 44…44, stranger 45…45 — fixtures, in the clear on purpose.
#   catalog      — the librarian and the installer are stems (the installer pulls over the mesh);
#                  the driver is the caller. Then the code run's phase 6, as stems: the driver kills
#                  the librarian and starts a late stem (`docker run`, the same image) that installs
#                  from the installer's re-served cache and answers — "installed from a peer cache".
#   model_deploy — a real model, both halves governed: the init (`prepare.sh`) downloads the
#                  TinyStories GGUF (~19 MB), writes the profile naming it by content address, and
#                  publishes both; a librarian stem serves them; the model-host stem places them
#                  and, by its `[[activation]]` (D21), uploads the weights to a pinned Ollama and
#                  creates the model under the profile's SYSTEM prompt — the capability goes live
#                  only once Ollama has it. The driver is the app: it asserts the governed SYSTEM
#                  prompt is what Ollama runs and that the model generates real tokens.
#   reheal_deploy — the model reheals onto a survivor: two hosts, each with its own pinned Ollama,
#                  a presence floor of one deployment. The origin deploys and, by its `[[serve]]`,
#                  serves the routable `llm/storyteller` while its deployment is live; the driver
#                  (the app) routes real inference through `InferenceRouter`, starts the survivor,
#                  kills the origin, and routes again — the survivor installed, activated into its
#                  own Ollama and served, and the tokens come from it.
#   llm_agent    — the browser demo's subject with real artifacts: n-0 a declared unit, n-1 installs
#                  a real dataset blob on the agent's demand (the real `data/loading` tier), n-2
#                  deploys a real model into its Ollama and serves `llm/inference` (D21, D22). The
#                  driver is the agent: it declares its needs, watches the loading tier, and routes
#                  a prompt, and calls the four MCP tools — weather, ping, search, calculate — which
#                  are components n-0 and n-1 host and the runtime bridges (zero-gaps Z4).
#   mcp_toolgrowth — the library and the tool-host are stems; the installed `tool/unit-convert`
#                  component is bridged as an MCP tool by the runtime (gateway feature), and the
#                  driver is the agent: it declares the need, finds the tool in KV, and calls it over
#                  `mcp.invoke` — "the converter code arrived over the mesh".

x-stem: &stem
  image: mycelium-stem:test
  build:
    context: ..
    dockerfile: docker/Dockerfile.stem
  restart: "no"
  environment: &stem-env
    RUST_LOG: "warn,mycelium_wasm_host=info"
    STEM_PUB_SEED: "4242424242424242424242424242424242424242424242424242424242424242"

services:
  # ── provisioning ────────────────────────────────────────────────────────────
  init-provisioning:
    <<: *stem
    profiles: [provisioning]
    container_name: mycelium-stem-init-provisioning
    entrypoint: ["sh", "-c"]
    command:
      - >-
        set -e; for d in /repo/examples/units/provisioning/artifacts/*.toml; do
        mycelium-artifact publish "$$d" --library /lib --key-env STEM_PUB_SEED; done;
        mycelium-artifact list /lib
    volumes: [ "lib:/lib" ]
    networks:
      stem-net: { ipv4_address: 172.40.0.2 }

  driver-provisioning:
    <<: *stem
    profiles: [provisioning]
    container_name: mycelium-stem-driver-provisioning
    entrypoint: ["stem_driver"]
    command: ["provisioning"]
    environment:
      <<: *stem-env
      STEM_DRIVER_HOST: 172.40.0.10
      STEM_PROVIDERS: "172.40.0.11=mycelium-stem-provider-a,172.40.0.12=mycelium-stem-provider-b,172.40.0.14=mycelium-stem-provider-c"
      STEM_PROVIDER_C_IP: 172.40.0.14
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "lib:/lib"
    depends_on:
      init-provisioning: { condition: service_completed_successfully }
    networks:
      stem-net: { ipv4_address: 172.40.0.10 }

  provider-a:
    <<: *stem
    profiles: [provisioning]
    container_name: mycelium-stem-provider-a
    command: ["--units", "/repo/examples/units/provisioning/provider-a.toml", "--library", "/lib", "--host", "172.40.0.11", "-p", "57000", "-r", "172.40.0.10:57000", "--tick-ms", "300"]
    volumes: [ "lib:/lib" ]
    depends_on: [ driver-provisioning ]
    networks:
      stem-net: { ipv4_address: 172.40.0.11 }

  provider-b:
    <<: *stem
    profiles: [provisioning]
    container_name: mycelium-stem-provider-b
    command: ["--units", "/repo/examples/units/provisioning/provider-b.toml", "--library", "/lib", "--host", "172.40.0.12", "-p", "57000", "-r", "172.40.0.10:57000", "--tick-ms", "300"]
    volumes: [ "lib:/lib" ]
    depends_on: [ driver-provisioning ]
    networks:
      stem-net: { ipv4_address: 172.40.0.12 }

  librarian-provisioning:
    <<: *stem
    profiles: [provisioning]
    container_name: mycelium-stem-librarian-provisioning
    command: ["--units", "/repo/examples/units/provisioning/librarian.toml", "--library", "/lib", "--librarian", "/lib/manifest", "--publisher", "ed25519:2152f8d19b791d24453242e15f2eab6cb7cffa7b6a5ed30097960e069881db12", "--host", "172.40.0.13", "-p", "57000", "-r", "172.40.0.10:57000", "--tick-ms", "300"]
    volumes: [ "lib:/lib" ]
    depends_on: [ driver-provisioning ]
    networks:
      stem-net: { ipv4_address: 172.40.0.13 }

  # ── catalog ─────────────────────────────────────────────────────────────────
  init-catalog:
    <<: *stem
    profiles: [catalog]
    container_name: mycelium-stem-init-catalog
    entrypoint: ["sh", "-c"]
    command:
      - >-
        set -e; for d in /repo/examples/units/catalog/artifacts/*.toml; do
        mycelium-artifact publish "$$d" --library /lib --key-env STEM_PUB_SEED; done;
        mycelium-artifact list /lib
    volumes: [ "lib:/lib" ]
    networks:
      stem-net: { ipv4_address: 172.40.0.3 }

  driver-catalog:
    <<: *stem
    profiles: [catalog]
    container_name: mycelium-stem-driver-catalog
    entrypoint: ["stem_driver"]
    command: ["catalog"]
    environment:
      <<: *stem-env
      STEM_DRIVER_HOST: 172.40.0.20
      STEM_LIBRARIAN_CONTAINER: mycelium-stem-librarian
      STEM_LATE_IP: 172.40.0.23
      STEM_INSTALLER_IP: 172.40.0.22
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      init-catalog: { condition: service_completed_successfully }
    networks:
      stem-net: { ipv4_address: 172.40.0.20 }

  librarian:
    <<: *stem
    profiles: [catalog]
    container_name: mycelium-stem-librarian
    command: ["--units", "/repo/examples/units/catalog/librarian.toml", "--library", "/lib", "--librarian", "/lib/manifest", "--publisher", "ed25519:2152f8d19b791d24453242e15f2eab6cb7cffa7b6a5ed30097960e069881db12", "--host", "172.40.0.21", "-p", "57000", "-r", "172.40.0.20:57000", "--tick-ms", "300"]
    volumes: [ "lib:/lib" ]
    depends_on: [ driver-catalog ]
    networks:
      stem-net: { ipv4_address: 172.40.0.21 }

  installer:
    <<: *stem
    profiles: [catalog]
    container_name: mycelium-stem-installer
    # No --library: the installer pulls over the mesh, from whoever advertises the librarian.
    command: ["--units", "/repo/examples/units/catalog/installer.toml", "--host", "172.40.0.22", "-p", "57000", "-r", "172.40.0.20:57000", "--tick-ms", "300"]
    depends_on: [ driver-catalog ]
    networks:
      stem-net: { ipv4_address: 172.40.0.22 }

  # ── catalog_store — the catalog demo with the library in an object store (zero-gaps Z1) ───────
  # S3Mock stands in for the bucket; the init publishes blob and manifest THROUGH the store adapter;
  # the librarian stem reads the manifest from the store and mirrors the bytes to a stage; the
  # installer stem's source is the store URL itself (no library directory, no mesh pull).
  s3mock:
    image: adobe/s3mock:latest
    profiles: [catalog_store]
    container_name: mycelium-stem-s3mock
    environment: { initialBuckets: mycelium-test }
    networks:
      stem-net: { ipv4_address: 172.40.0.30 }

  init-catalog_store:
    <<: *stem
    profiles: [catalog_store]
    container_name: mycelium-stem-init-catalog_store
    entrypoint: ["sh", "-c"]
    environment:
      <<: *stem-env
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT: http://172.40.0.30:9090
      AWS_ALLOW_HTTP: "true"
      AWS_REGION: us-east-1
    command:
      - >-
        set -e; i=0; until curl -sf -X PUT http://172.40.0.30:9090/mycelium-test >/dev/null 2>&1 || [ $$i -ge 60 ]; do i=$$((i+1)); sleep 1; done;
        curl -sf http://172.40.0.30:9090/ | grep -q mycelium-test;
        for d in /repo/examples/units/catalog/artifacts/*.toml; do
        mycelium-artifact publish "$$d" --library s3://mycelium-test/library --key-env STEM_PUB_SEED; done;
        mycelium-artifact list s3://mycelium-test/library
    depends_on: [ s3mock ]
    networks:
      stem-net: { ipv4_address: 172.40.0.31 }

  driver-catalog_store:
    <<: *stem
    profiles: [catalog_store]
    container_name: mycelium-stem-driver-catalog_store
    entrypoint: ["stem_driver"]
    command: ["catalog_store"]
    environment:
      <<: *stem-env
      STEM_DRIVER_HOST: 172.40.0.32
    depends_on:
      init-catalog_store: { condition: service_completed_successfully }
    networks:
      stem-net: { ipv4_address: 172.40.0.32 }

  librarian-store:
    <<: *stem
    profiles: [catalog_store]
    container_name: mycelium-stem-librarian-store
    environment:
      <<: *stem-env
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT: http://172.40.0.30:9090
      AWS_ALLOW_HTTP: "true"
      AWS_REGION: us-east-1
    command: ["--units", "/repo/examples/units/catalog/librarian.toml", "--library", "s3://mycelium-test/library", "--librarian", "/tmp/manifest-unused", "--manifest-source", "s3://mycelium-test/library", "--publisher", "ed25519:2152f8d19b791d24453242e15f2eab6cb7cffa7b6a5ed30097960e069881db12", "--host", "172.40.0.33", "-p", "57000", "-r", "172.40.0.32:57000", "--tick-ms", "300"]
    depends_on: [ driver-catalog_store ]
    networks:
      stem-net: { ipv4_address: 172.40.0.33 }

  installer-store:
    <<: *stem
    profiles: [catalog_store]
    container_name: mycelium-stem-installer-store
    environment:
      <<: *stem-env
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT: http://172.40.0.30:9090
      AWS_ALLOW_HTTP: "true"
      AWS_REGION: us-east-1
    # The source is the store: no library directory, no mesh pull.
    command: ["--units", "/repo/examples/units/catalog/installer.toml", "--library", "s3://mycelium-test/library", "--host", "172.40.0.34", "-p", "57000", "-r", "172.40.0.32:57000", "--tick-ms", "300"]
    depends_on: [ driver-catalog_store ]
    networks:
      stem-net: { ipv4_address: 172.40.0.34 }

  # ── mcp_toolgrowth ──────────────────────────────────────────────────────────
  init-mcp_toolgrowth:
    <<: *stem
    profiles: [mcp_toolgrowth]
    container_name: mycelium-stem-init-mcp_toolgrowth
    entrypoint: ["sh", "-c"]
    command:
      - >-
        set -e; for d in /repo/examples/units/mcp_toolgrowth/artifacts/*.toml; do
        mycelium-artifact publish "$$d" --library /lib --key-env STEM_PUB_SEED; done;
        mycelium-artifact list /lib
    volumes: [ "lib:/lib" ]
    networks:
      stem-net: { ipv4_address: 172.40.0.4 }

  driver-mcp_toolgrowth:
    <<: *stem
    profiles: [mcp_toolgrowth]
    container_name: mycelium-stem-driver-mcp_toolgrowth
    entrypoint: ["stem_driver"]
    command: ["mcp_toolgrowth"]
    environment:
      <<: *stem-env
      STEM_DRIVER_HOST: 172.40.0.30
    depends_on:
      init-mcp_toolgrowth: { condition: service_completed_successfully }
    networks:
      stem-net: { ipv4_address: 172.40.0.30 }

  library:
    <<: *stem
    profiles: [mcp_toolgrowth]
    container_name: mycelium-stem-library
    command: ["--units", "/repo/examples/units/mcp_toolgrowth/library.toml", "--library", "/lib", "--librarian", "/lib/manifest", "--publisher", "ed25519:2152f8d19b791d24453242e15f2eab6cb7cffa7b6a5ed30097960e069881db12", "--host", "172.40.0.31", "-p", "57000", "-r", "172.40.0.30:57000", "--tick-ms", "300"]
    volumes: [ "lib:/lib" ]
    depends_on: [ driver-mcp_toolgrowth ]
    networks:
      stem-net: { ipv4_address: 172.40.0.31 }

  tool-host:
    <<: *stem
    profiles: [mcp_toolgrowth]
    container_name: mycelium-stem-tool-host
    command: ["--units", "/repo/examples/units/mcp_toolgrowth/tool-host.toml", "--host", "172.40.0.32", "-p", "57000", "-r", "172.40.0.30:57000", "--tick-ms", "300"]
    depends_on: [ driver-mcp_toolgrowth ]
    networks:
      stem-net: { ipv4_address: 172.40.0.32 }

  # ── model_deploy ────────────────────────────────────────────────────────────
  ollama:
    profiles: [model_deploy]
    image: ollama/ollama:0.9.0
    container_name: mycelium-stem-ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks:
      stem-net: { ipv4_address: 172.40.0.45 }

  init-model_deploy:
    <<: *stem
    profiles: [model_deploy]
    container_name: mycelium-stem-init-model_deploy
    entrypoint: ["sh", "/repo/examples/units/model_deploy/prepare.sh", "/lib"]
    command: []
    volumes: [ "lib:/lib" ]
    networks:
      stem-net: { ipv4_address: 172.40.0.5 }

  driver-model_deploy:
    <<: *stem
    profiles: [model_deploy]
    container_name: mycelium-stem-driver-model_deploy
    entrypoint: ["stem_driver"]
    command: ["model_deploy"]
    environment:
      <<: *stem-env
      STEM_DRIVER_HOST: 172.40.0.40
      OLLAMA_HOST: http://172.40.0.45:11434
    depends_on:
      init-model_deploy: { condition: service_completed_successfully }
      ollama: { condition: service_healthy }
    networks:
      stem-net: { ipv4_address: 172.40.0.40 }

  librarian-model_deploy:
    <<: *stem
    profiles: [model_deploy]
    container_name: mycelium-stem-librarian-model_deploy
    command: ["--units", "/repo/examples/units/model_deploy/librarian.toml", "--library", "/lib", "--librarian", "/lib/manifest", "--publisher", "ed25519:2152f8d19b791d24453242e15f2eab6cb7cffa7b6a5ed30097960e069881db12", "--host", "172.40.0.41", "-p", "57000", "-r", "172.40.0.40:57000", "--tick-ms", "300"]
    volumes: [ "lib:/lib" ]
    depends_on: [ driver-model_deploy ]
    networks:
      stem-net: { ipv4_address: 172.40.0.41 }

  model-host:
    <<: *stem
    profiles: [model_deploy]
    container_name: mycelium-stem-model-host
    environment:
      <<: *stem-env
      OLLAMA_HOST: http://172.40.0.45:11434
    command: ["--units", "/repo/examples/units/model_deploy/model-host.toml", "--library", "/lib", "--host", "172.40.0.42", "-p", "57000", "-r", "172.40.0.40:57000", "--tick-ms", "300"]
    volumes: [ "lib:/lib" ]
    depends_on: [ driver-model_deploy ]
    networks:
      stem-net: { ipv4_address: 172.40.0.42 }

  # ── reheal_deploy ───────────────────────────────────────────────────────────
  ollama-origin:
    profiles: [reheal_deploy]
    image: ollama/ollama:0.9.0
    container_name: mycelium-stem-ollama-origin
    healthcheck: { test: ["CMD", "ollama", "list"], interval: 3s, timeout: 3s, retries: 40 }
    networks:
      stem-net: { ipv4_address: 172.40.0.55 }

  ollama-survivor:
    profiles: [reheal_deploy]
    image: ollama/ollama:0.9.0
    container_name: mycelium-stem-ollama-survivor
    healthcheck: { test: ["CMD", "ollama", "list"], interval: 3s, timeout: 3s, retries: 40 }
    networks:
      stem-net: { ipv4_address: 172.40.0.56 }

  init-reheal_deploy:
    <<: *stem
    profiles: [reheal_deploy]
    container_name: mycelium-stem-init-reheal_deploy
    entrypoint: ["sh", "/repo/examples/units/reheal_deploy/prepare.sh", "/lib"]
    command: []
    volumes: [ "lib:/lib" ]
    networks:
      stem-net: { ipv4_address: 172.40.0.6 }

  driver-reheal_deploy:
    <<: *stem
    profiles: [reheal_deploy]
    container_name: mycelium-stem-driver-reheal_deploy
    entrypoint: ["stem_driver"]
    command: ["reheal_deploy"]
    environment:
      <<: *stem-env
      STEM_DRIVER_HOST: 172.40.0.50
      STEM_ORIGIN: "172.40.0.52=mycelium-stem-origin"
      STEM_SURVIVOR_IP: 172.40.0.53
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      init-reheal_deploy: { condition: service_completed_successfully }
      ollama-origin: { condition: service_healthy }
      ollama-survivor: { condition: service_healthy }
    networks:
      stem-net: { ipv4_address: 172.40.0.50 }

  librarian-reheal_deploy:
    <<: *stem
    profiles: [reheal_deploy]
    container_name: mycelium-stem-librarian-reheal_deploy
    command: ["--units", "/repo/examples/units/reheal_deploy/librarian.toml", "--library", "/lib", "--librarian", "/lib/manifest", "--publisher", "ed25519:2152f8d19b791d24453242e15f2eab6cb7cffa7b6a5ed30097960e069881db12", "--host", "172.40.0.51", "-p", "57000", "-r", "172.40.0.50:57000", "--tick-ms", "300"]
    volumes: [ "lib:/lib" ]
    depends_on: [ driver-reheal_deploy ]
    networks:
      stem-net: { ipv4_address: 172.40.0.51 }

  origin:
    <<: *stem
    profiles: [reheal_deploy]
    container_name: mycelium-stem-origin
    environment:
      <<: *stem-env
      OLLAMA_HOST: http://172.40.0.55:11434
    command: ["--units", "/repo/examples/units/reheal_deploy/origin.toml", "--library", "/lib", "--host", "172.40.0.52", "-p", "57000", "-r", "172.40.0.50:57000", "--tick-ms", "300"]
    volumes: [ "lib:/lib" ]
    depends_on: [ driver-reheal_deploy ]
    networks:
      stem-net: { ipv4_address: 172.40.0.52 }

  # ── llm_agent ───────────────────────────────────────────────────────────────
  ollama-llm_agent:
    profiles: [llm_agent]
    image: ollama/ollama:0.9.0
    container_name: mycelium-stem-ollama-llm_agent
    healthcheck: { test: ["CMD", "ollama", "list"], interval: 3s, timeout: 3s, retries: 40 }
    networks:
      stem-net: { ipv4_address: 172.40.0.65 }

  init-llm_agent:
    <<: *stem
    profiles: [llm_agent]
    container_name: mycelium-stem-init-llm_agent
    entrypoint: ["sh", "/repo/examples/units/llm_agent/prepare.sh", "/lib"]
    command: []
    volumes: [ "lib:/lib" ]
    networks:
      stem-net: { ipv4_address: 172.40.0.7 }

  driver-llm_agent:
    <<: *stem
    profiles: [llm_agent]
    container_name: mycelium-stem-driver-llm_agent
    entrypoint: ["stem_driver"]
    command: ["llm_agent"]
    environment:
      <<: *stem-env
      STEM_DRIVER_HOST: 172.40.0.60
    depends_on:
      init-llm_agent: { condition: service_completed_successfully }
      ollama-llm_agent: { condition: service_healthy }
    networks:
      stem-net: { ipv4_address: 172.40.0.60 }

  librarian-llm_agent:
    <<: *stem
    profiles: [llm_agent]
    container_name: mycelium-stem-librarian-llm_agent
    command: ["--units", "/repo/examples/units/llm_agent/librarian.toml", "--library", "/lib", "--librarian", "/lib/manifest", "--publisher", "ed25519:2152f8d19b791d24453242e15f2eab6cb7cffa7b6a5ed30097960e069881db12", "--host", "172.40.0.61", "-p", "57000", "-r", "172.40.0.60:57000", "--tick-ms", "300"]
    volumes: [ "lib:/lib" ]
    depends_on: [ driver-llm_agent ]
    networks:
      stem-net: { ipv4_address: 172.40.0.61 }

  n-0:
    <<: *stem
    profiles: [llm_agent]
    container_name: mycelium-stem-n-0
    command: ["--units", "/repo/examples/units/llm_agent/n-0.toml", "--host", "172.40.0.62", "-p", "57000", "-r", "172.40.0.60:57000", "--tick-ms", "300"]
    depends_on: [ driver-llm_agent ]
    networks:
      stem-net: { ipv4_address: 172.40.0.62 }

  n-1:
    <<: *stem
    profiles: [llm_agent]
    container_name: mycelium-stem-n-1
