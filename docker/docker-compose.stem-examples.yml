# The stem-examples suite (design-time-tooling.md §16, X2): a co-op demo run **both ways** — as the
# in-process code binary (the coop smoke) and as stem nodes from one image fed the demo's
# declaration directory (`examples/units/<demo>/`), reaching the same asserted outcome.
#
#   make test-stem-examples                # every recut demo
#   make examples-both-ways DEMO=provisioning
#
# Profiles: one per demo. Each has an `init` that publishes the demo's artifact descriptions into
# the shared library volume with the suite's test key (seed 42…42 — a fixture, not a secret; the
# public half is in every hosting unit's `trusted_publishers`), a driver (the roles §16 keeps as
# code: the buffer, the seeder, the worker, and the asserts) that is also the fleet's bootstrap
# seed, and the stems. Static IPs: a node id is `ip:port`. No TLS: one private network.
#
# What each profile recuts, and what it does not:
#   provisioning — providers a and b are stems (`--library /lib`); the driver seeds, drains, kills
#                  the active provider through the docker socket, and drains again. Same markers
#                  as the code run ("self-healed"). Wave 3 (shadow-then-accept) is not recut: an
#                  acceptance is a manifest rewrite the driver would have to make in the library
#                  volume and the stems re-read — open.
#   catalog      — the librarian and the installer are stems (the installer pulls over the mesh);
#                  the driver is the caller. The code run's phase 6 (a late joiner installing from
#                  a peer's cache) has no stem equivalent: a stem does not re-serve its cache — open.

x-stem: &stem
  image: mycelium-stem:test
  build:
    context: ..
    dockerfile: docker/Dockerfile.stem
  restart: "no"
  environment: &stem-env
    RUST_LOG: "warn,mycelium_wasm_host=info"
    STEM_PUB_SEED: "4242424242424242424242424242424242424242424242424242424242424242"

services:
  # ── provisioning ────────────────────────────────────────────────────────────
  init-provisioning:
    <<: *stem
    profiles: [provisioning]
    container_name: mycelium-stem-init-provisioning
    entrypoint: ["sh", "-c"]
    command:
      - >-
        set -e; for d in /repo/examples/units/provisioning/artifacts/*.toml; do
        mycelium-artifact publish "$$d" --library /lib --key-env STEM_PUB_SEED; done;
        mycelium-artifact list /lib
    volumes: [ "lib:/lib" ]
    networks:
      stem-net: { ipv4_address: 172.40.0.2 }

  driver-provisioning:
    <<: *stem
    profiles: [provisioning]
    container_name: mycelium-stem-driver-provisioning
    entrypoint: ["stem_driver"]
    command: ["provisioning"]
    environment:
      <<: *stem-env
      STEM_DRIVER_HOST: 172.40.0.10
      STEM_PROVIDERS: "172.40.0.11=mycelium-stem-provider-a,172.40.0.12=mycelium-stem-provider-b"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      init-provisioning: { condition: service_completed_successfully }
    networks:
      stem-net: { ipv4_address: 172.40.0.10 }

  provider-a:
    <<: *stem
    profiles: [provisioning]
    container_name: mycelium-stem-provider-a
    command: ["--units", "/repo/examples/units/provisioning/provider-a.toml", "--library", "/lib", "--host", "172.40.0.11", "-p", "57000", "-r", "172.40.0.10:57000", "--tick-ms", "300"]
    volumes: [ "lib:/lib" ]
    depends_on: [ driver-provisioning ]
    networks:
      stem-net: { ipv4_address: 172.40.0.11 }

  provider-b:
    <<: *stem
    profiles: [provisioning]
    container_name: mycelium-stem-provider-b
    command: ["--units", "/repo/examples/units/provisioning/provider-b.toml", "--library", "/lib", "--host", "172.40.0.12", "-p", "57000", "-r", "172.40.0.10:57000", "--tick-ms", "300"]
    volumes: [ "lib:/lib" ]
    depends_on: [ driver-provisioning ]
    networks:
      stem-net: { ipv4_address: 172.40.0.12 }

  # ── catalog ─────────────────────────────────────────────────────────────────
  init-catalog:
    <<: *stem
    profiles: [catalog]
    container_name: mycelium-stem-init-catalog
    entrypoint: ["sh", "-c"]
    command:
      - >-
        set -e; for d in /repo/examples/units/catalog/artifacts/*.toml; do
        mycelium-artifact publish "$$d" --library /lib --key-env STEM_PUB_SEED; done;
        mycelium-artifact list /lib
    volumes: [ "lib:/lib" ]
    networks:
      stem-net: { ipv4_address: 172.40.0.3 }

  driver-catalog:
    <<: *stem
    profiles: [catalog]
    container_name: mycelium-stem-driver-catalog
    entrypoint: ["stem_driver"]
    command: ["catalog"]
    environment:
      <<: *stem-env
      STEM_DRIVER_HOST: 172.40.0.20
    depends_on:
      init-catalog: { condition: service_completed_successfully }
    networks:
      stem-net: { ipv4_address: 172.40.0.20 }

  librarian:
    <<: *stem
    profiles: [catalog]
    container_name: mycelium-stem-librarian
    command: ["--units", "/repo/examples/units/catalog/librarian.toml", "--library", "/lib", "--librarian", "/lib/manifest", "--publisher", "ed25519:2152f8d19b791d24453242e15f2eab6cb7cffa7b6a5ed30097960e069881db12", "--host", "172.40.0.21", "-p", "57000", "-r", "172.40.0.20:57000", "--tick-ms", "300"]
    volumes: [ "lib:/lib" ]
    depends_on: [ driver-catalog ]
    networks:
      stem-net: { ipv4_address: 172.40.0.21 }

  installer:
    <<: *stem
    profiles: [catalog]
    container_name: mycelium-stem-installer
    # No --library: the installer pulls over the mesh, from whoever advertises the librarian.
    command: ["--units", "/repo/examples/units/catalog/installer.toml", "--host", "172.40.0.22", "-p", "57000", "-r", "172.40.0.20:57000", "--tick-ms", "300"]
    depends_on: [ driver-catalog ]
    networks:
      stem-net: { ipv4_address: 172.40.0.22 }

volumes:
  lib:

networks:
  stem-net:
    ipam:
      config:
        - subnet: 172.40.0.0/24
