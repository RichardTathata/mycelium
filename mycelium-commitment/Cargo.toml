[package]
name = "mycelium-commitment"
version = "2.7.0"
edition = "2024"
rust-version = "1.88"
authors = ["Dr. Richard Nicholson <tathatasystems@proton.me>"]
description = "The commitment companion for Mycelium (v3 contracts axis §6.9, CN1): the contract net as five records — announce · offer · award · report · assess — each with a mechanism the substrate already has, the award a receipt-bearing write and never a KV write alone. Built entirely on Mycelium's public API."
license = "AGPL-3.0-only"
repository = "https://github.com/RichardEko/mycelium"
keywords = ["contract-net", "commitment", "coordination", "multi-agent", "distributed-systems"]
categories = ["asynchronous", "network-programming"]

[dependencies]
# Companion-crate contract: only Mycelium's PUBLIC API is used — no internal
# access. This dependency line is itself the composability proof.
mycelium = { path = "..", default-features = false, features = ["consensus"] }

bytes         = "1"
ed25519-dalek = "2"
serde         = { version = "1.0", features = ["derive"] }
serde_json    = "1.0"
tokio         = { version = "1.35", features = ["rt"] }

[dev-dependencies]
# `sim`: the tests record a linearizable award under the replay kernel (CN2); `test-util`: the
# bind-verified port allocator.
mycelium = { path = "..", default-features = false, features = ["test-util", "sim"] }
mycelium-sim = { path = "../mycelium-sim" }
tokio = { version = "1.35", features = ["full"] }
