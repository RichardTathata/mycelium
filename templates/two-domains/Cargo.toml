[package]
name = "two-domains"
version = "0.1.0"
edition = "2024"
publish = false

# The fleet substrate, pinned to the release this scaffold came from (`mycelium init` wrote the tag). The
# supported path is this git tag, never a registry package of the same name. `tls` for the mesh, the gateway and
# the federation edge; `a2a` for the door a partner's call arrives at; `compliance` for the audit chain and the
# named-token table `secure-multi-domain` requires.
[dependencies]
mycelium = { git = "https://github.com/RichardTathata/mycelium", tag = "{{MYCELIUM_TAG}}", features = ["tls", "a2a", "compliance"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# `tamper` only: one request to the partner's edge, over the same pinned TLS the client uses.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# This directory is a project of its own — inside the repository that embeds it and outside it alike.
[workspace]
