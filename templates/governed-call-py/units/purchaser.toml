# The purchaser, as an SDK agent declares it (POST /gateway/units/declare). The node advertises the capability on
# the agent's behalf. The mandate and the rule are accepted and reported back as `not_enforced`: the published node
# attaches no policy evaluator, so they are the declaration `wire-check` draws, not a check this node makes.
principal = "purchaser"
runtime   = "python"   # mycelium-py loads this unit: `mycelium wire-check units/` says what that runtime carries

[[capability]]
ns       = "purchase"
name     = "place"
ttl_secs = 30
  [capability.attrs]
  ledger = "petty-cash"

[[mandate]]
holder     = "purchaser"
scope      = "petty-cash"
operations = ["tools/call:tool:purchase.place"]

[[rule]]
actor           = "*"
operation       = "tools/call"
resource        = "tool:purchase.place"
requires_values = { ledger = "petty-cash" }

# A tool that waits for a grant (adopter-surface X3): the purchaser may call it only under a grant the treasurer
# issues for that one call — approval that is default-deny. `mycelium test --faults grant units/ --config grant.toml`
# (grant.toml: node.toml with [tls] and [persistence] tables appended — the README's grant.toml line) drives these two
# rules on this declaration's fleet: silence refuses, a principal no rule names is refused the issue, the
# treasurer's grant admits the call once, and the grant holds across a restart of the purchaser's node. The actor
# names this unit; at a door the agent presents as its node (`node:<id>`), the one principal that can hold a grant.
[[rule]]
actor          = "purchaser"
operation      = "tools/call"
resource       = "tool:purchase.approve"
requires_grant = true

# The treasurer as a gateway presents them: a named token's principal is `token:<issuer>/<name>`, and node.toml sets
# the issuer (`gateway_identity_issuer = "governed-call"`). A rule's actor is matched exactly.
[[rule]]
actor     = "token:governed-call/treasurer"
operation = "grant.issue"
resource  = "tool:purchase.approve"

# The treasurer may revoke what they issue: without this rule nobody can.
[[rule]]
actor     = "token:governed-call/treasurer"
operation = "grant.revoke"
resource  = "tool:purchase.approve"
