[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "langgraph-checkpoint-mycelium"
version     = "0.3.5"
description = "LangGraph checkpointer backed by the Mycelium mesh — metadata in gossiped KV, payloads in the content-addressed blob tier"
requires-python = ">=3.10"
# A security floor (0.3.5): GHSA-wwqv-p2pp-99h5 (fixed in 3.0.0) and GHSA-fjqc-hq36-qh5p (4.1.1) reach the
# saver's loads, GHSA-mhr3-j7m5-c7c9 (4.0.0) does not. It does not make a member-written row safe to load
# (README, "What the serializer trusts").
dependencies = [
    "langgraph-checkpoint>=4.1.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.3.0", "langgraph>=1.0.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_checkpoint_mycelium"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
