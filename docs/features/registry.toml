# ------------------------------------------------------------------------------------------- exclusions

[[exclusion]]
reason = "A test or fuzz build switch, never on in a shipped build: it exposes internals to a harness (fuzz-internals, test-util, test-support), filters frames in tests (test-frame-filter), or turns on this crate's own test seams (mycelium-wasm-host's sim)."
ids = ["cargo:mycelium/fuzz-internals", "cargo:mycelium/test-util", "cargo:mycelium/test-frame-filter",
       "cargo:mycelium-core/test-frame-filter", "cargo:mycelium-core/test-support", "cargo:mycelium-wasm-host/sim"]

[[exclusion]]
reason = "Builds the `mycelium` binary (with its log subscriber); the binary is how a node is run, and its subcommands belong to the features they serve (wire-check, node identity, replay)."
ids = ["cargo:mycelium/cli"]

[[exclusion]]
reason = "A crate's `default` set: a list of other features, each mapped on its own."
ids = ["cargo:mycelium/default", "cargo:mycelium-core/default", "cargo:mycelium-blackboard/default",
       "cargo:mycelium-effects/default", "cargo:mycelium-guardrails/default", "cargo:mycelium-reason/default",
       "cargo:mycelium-tuple-space/default", "cargo:mycelium-wiki/default"]

[[exclusion]]
reason = "The co-op examples crate's build switches: they select which examples compile, and the examples are routed by the example index, not by feature pages."
ids = ["cargo:mycelium-coop-examples/wasm", "cargo:mycelium-coop-examples/metrics"]

[[exclusion]]
reason = "A disambiguation entry of the glossary (\"Things called …\"): it separates several meanings of one word, each of which belongs to its own feature."
ids = ["concept:claim", "concept:scope", "concept:journal", "concept:catalogue-meanings", "concept:admission"]

[[exclusion]]
reason = "Declaration vocabulary every unit file uses (the plan's stated exclusion): who the unit is and what it offers and needs. Covered by the unit-file reference and the unit files and wire-check page, and, at runtime, by capability discovery."
ids = ["unit:principal", "unit:[[capability]]", "unit:[[requirement]]"]

[[exclusion]]
reason = "An external prerequisite, not a feature: a node cannot verify its own clock, so the guarantee report reads it not_verifiable_here and never counts it; the threat model states what depends on it."
ids = ["guarantee:clock.sync"]
