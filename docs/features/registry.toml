# The feature registry (docs/plans/feature-pages.md F-G, row F2).
#
# Every id from the seven sources maps here exactly once: to a [[feature]] (a page, or page = "todo" for a page
# row F3 writes) or to an [[exclusion]] with its reason. scripts/check-feature-pages.py fails on an id no entry
# maps, on an id mapped twice, and on a mapped id no source has. A wrong exclusion hides a feature, so each
# says why the ids it holds are not a reader-facing feature.
#
# Ids are `<source>:<id>` (seven sources):
#   concept:<anchor>              a quick-reference row of docs/guide/00-concepts.md, by its `<a id>` (a row
#                                 without one fails the gate)
#   guarantee:<id>                docs/reference/guarantee-catalogue.json (the core's guarantees)
#   rule:<id>                     docs/reference/rule-catalogue.json
#   unit:<key>                    a unit-file key, read from NodeCapabilityConfig in src/capability_config.rs (and
#                                 its confine/egress sub-tables); each must have a heading in docs/reference/unit-file.md
#   cargo:<crate>/<feature>       a Cargo feature of any workspace crate, implicit ones (an optional dependency no
#                                 feature names as dep:) included
#   companion-guarantee:<id>      a guarantee a crate registers in code (`GuaranteeDescriptor::new("<id>"`,
#                                 outside tests) that is not in the catalogue — plan P3, decided in F2
#   crate:<name>                  a workspace crate (a page names it in backticks or links its directory)
#
# A [[feature]] holds these keys, and an [[exclusion]] `reason` and `ids`; any other key is refused, so a typo
# cannot drop a check. One page belongs to one feature.
#   name      the feature, as a reader would name it
#   page      its page in docs/features/, or "todo" (F3); a "todo" entry names its `planned` page
#   example   with a page: the example's name in the example index's capability matrix, or "none" (P2) —
#             then the page's *See it work* opens "No runnable example exists", and the gate fails if the
#             matrix gains a row whose name contains the page's name in snake case or an `example_watch`
#             entry, or that links the page
#   ids       the ids this feature owns; the page must link each (a concept or unit-file section by its
#             anchor, a guarantee or rule inside a link to its catalogue, a Cargo feature or companion
#             guarantee named in backticks)
#   links     ids another feature owns that this page must link too

